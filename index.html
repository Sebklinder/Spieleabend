  // ===================================================================
  // ---------- Knack (echtes Kartenspiel: 31 / Schwimmen) ----------
  // ===================================================================
  var KNACK_HISTORY_KEY = 'knack_matches_v1';
  var knackSetupNames = ['', ''];
  var knackSetupLives = 3;
  var knackState = {
    phase: 'setup', // setup | interstitial | turn | roundEnd | finished
    players: [], // {name, lives, startLives, out, outRound, hand:[card,card,card]}
    table: [],
    order: [], // active player indices in turn order for this round
    turnPointer: 0,
    round: 1,
    roundStartOffset: 0,
    knockedByOrder: -1, // index into order[] of who knocked, -1 = nobody yet
    turnsLeftAfterKnock: 0,
    selectedTable: null,
    selectedHand: null,
    pendingReveal: null, // order-index about to see the interstitial
    roundResults: null,
    matchRecorded: false,
    showHistory: false
  };

  // ---------- Card deck & scoring (31 / Schwimmen rules) ----------
  var KNACK_SUITS = ['♠','♥','♦','♣'];
  var KNACK_RED_SUITS = ['♥','♦'];
  var KNACK_RANKS = ['7','8','9','10','J','Q','K','A'];
  var KNACK_RANK_VALUE = {'7':7,'8':8,'9':9,'10':10,'J':10,'Q':10,'K':10,'A':11};

  function buildKnackDeck() {
    var deck = [];
    KNACK_SUITS.forEach(function(s) {
      KNACK_RANKS.forEach(function(r) {
        deck.push({suit:s, rank:r, value:KNACK_RANK_VALUE[r]});
      });
    });
    return deck;
  }
  function shuffleDeck(arr) {
    for (var i=arr.length-1;i>0;i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    return arr;
  }
  function isKnackRedSuit(s) { return KNACK_RED_SUITS.indexOf(s) !== -1; }
  function computeKnackHandScore(hand) {
    var suitSums = {};
    hand.forEach(function(c) { suitSums[c.suit] = (suitSums[c.suit]||0) + c.value; });
    var maxSuitSum = 0;
    Object.keys(suitSums).forEach(function(s) { if (suitSums[s] > maxSuitSum) maxSuitSum = suitSums[s]; });
    var isDrilling = hand.length === 3 && hand[0].rank === hand[1].rank && hand[1].rank === hand[2].rank;
    var score = isDrilling ? Math.max(30.5, maxSuitSum) : maxSuitSum;
    return { score: score, isDrilling: isDrilling, isPerfect: maxSuitSum === 31 };
  }
  function formatKnackScore(n) { return n % 1 === 0 ? String(n) : n.toFixed(1); }
  function renderCardHtml(card, idx, selected, group) {
    var red = isKnackRedSuit(card.suit);
    return '<div class="playing-card' + (red?' red':' black') + (selected?' selected':'') + '" data-idx="' + idx + '" data-group="' + group + '">' +
      '<div>' + card.rank + '</div><div class="suit">' + card.suit + '</div>' +
    '</div>';
  }
  function renderStaticCardHtml(card) {
    var red = isKnackRedSuit(card.suit);
    return '<div class="playing-card static' + (red?' red':' black') + '">' +
      '<div>' + card.rank + '</div><div class="suit">' + card.suit + '</div>' +
    '</div>';
  }

  function loadKnackHistory() {
    try {
      var raw = localStorage.getItem(KNACK_HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }
  function saveKnackHistory(list) {
    try { localStorage.setItem(KNACK_HISTORY_KEY, JSON.stringify(list)); } catch(e) {}
  }
  function recordKnackMatch() {
    if (knackState.matchRecorded) return;
    knackState.matchRecorded = true;
    var winner = knackState.players.filter(function(p){ return !p.out; })[0];
    var results = knackState.players.map(function(p) {
      return { name: p.name, out: p.out, outRound: p.outRound || null };
    });
    var match = {
      id: 'k_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      date: new Date().toISOString(),
      rounds: knackState.round,
      players: results,
      winner: winner ? winner.name : null
    };
    var history = loadKnackHistory();
    history.unshift(match);
    if (history.length > 200) history = history.slice(0, 200);
    saveKnackHistory(history);
  }
  function computeKnackStats(history) {
    var stats = {};
    history.forEach(function(m) {
      m.players.forEach(function(p) {
        if (!stats[p.name]) stats[p.name] = {name:p.name, games:0, wins:0};
        stats[p.name].games++;
        if (m.winner === p.name) stats[p.name].wins++;
      });
    });
    return Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b) {
      return b.wins - a.wins || b.games - a.games;
    });
  }
  function matchLineKnack(m) {
    return (m.winner ? '👑 ' + escapeHtml(m.winner) : 'Alle raus') + ' · ' + m.rounds + ' Runden · ' + m.players.length + ' Spieler';
  }

  function renderKnackScreen() {
    if (knackState.phase === 'setup') renderKnackSetup();
    else if (knackState.phase === 'interstitial') renderKnackInterstitial();
    else if (knackState.phase === 'turn') renderKnackTurn();
    else if (knackState.phase === 'roundEnd') renderKnackRoundEnd();
    else if (knackState.phase === 'finished') renderKnackFinished();

    if (knackState.showHistory) renderKnackHistoryOverlay();
  }

    });
    document.querySelectorAll('.knack-remove').forEach(function(btn) {
      btn.addEventListener('click', function() { knackSetupNames.splice(Number(this.dataset.idx), 1); render(); });
    });
    document.getElementById('knackAddPlayer').addEventListener('click', function() {
      if (knackSetupNames.length < 8) { knackSetupNames.push(''); render(); }
    });
    document.querySelectorAll('[data-lives]').forEach(function(btn) {
      btn.addEventListener('click', function() { knackSetupLives = Number(this.dataset.lives); render(); });
    });
    document.getElementById('knackStart').addEventListener('click', startKnack);
  }

  function startKnack() {
    var names = knackSetupNames.map(function(n, i){ return n.trim() || ('Spieler ' + (i+1)); });
    if (names.length < 2) names = names.concat(['Spieler 2']);
    knackState.players = names.map(function(n) {
      return { name: n, lives: knackSetupLives, startLives: knackSetupLives, out: false, outRound: null, hand: [] };
    });
    knackState.round = 1;
    knackState.roundStartOffset = 0;
    knackState.matchRecorded = false;
    dealKnackRound();
    render();
  }

  function dealKnackRound() {
    var deck = shuffleDeck(buildKnackDeck());
    var active = [];
    knackState.players.forEach(function(p, i) { if (!p.out) active.push(i); });
    active.forEach(function(idx) {
      knackState.players[idx].hand = [deck.pop(), deck.pop(), deck.pop()];
    });
    knackState.table = [deck.pop(), deck.pop(), deck.pop()];
    var startPos = knackState.roundStartOffset % active.length;
    knackState.order = active.slice(startPos).concat(active.slice(0, startPos));
    knackState.turnPointer = 0;
    knackState.knockedByOrder = -1;
    knackState.turnsLeftAfterKnock = 0;
    knackState.selectedTable = null;
    knackState.selectedHand = null;
    knackState.roundResults = null;
    knackState.phase = 'interstitial';
    knackState.pendingReveal = knackState.order[0];
  }

  function knackHandleSwap(kind) {
    var pIdx = knackState.order[knackState.turnPointer];
    var player = knackState.players[pIdx];
    if (kind === 'one') {
      if (knackState.selectedTable === null || knackState.selectedHand === null) return;
      var tCard = knackState.table[knackState.selectedTable];
      var hCard = player.hand[knackState.selectedHand];
      knackState.table[knackState.selectedTable] = hCard;
      player.hand[knackState.selectedHand] = tCard;
    } else {
      var oldHand = player.hand;
      player.hand = knackState.table;
      knackState.table = oldHand;
    }
    var info = computeKnackHandScore(player.hand);
    if (info.isPerfect) {
      finishKnackRound();
      return;
    }
    knackAdvanceTurn(false);
  }

  function knackAdvanceTurn(didKnock) {
    if (didKnock) {
      knackState.knockedByOrder = knackState.turnPointer;
      knackState.turnsLeftAfterKnock = knackState.order.length - 1;
    } else if (knackState.knockedByOrder !== -1) {
      knackState.turnsLeftAfterKnock--;
    }
    if (knackState.knockedByOrder !== -1 && knackState.turnsLeftAfterKnock <= 0) {
      finishKnackRound();
      return;
    }
    knackState.turnPointer = (knackState.turnPointer + 1) % knackState.order.length;
    knackState.selectedTable = null;
    knackState.selectedHand = null;
    knackState.phase = 'interstitial';
    knackState.pendingReveal = knackState.order[knackState.turnPointer];
    render();
  }

  function finishKnackRound() {
    var results = knackState.order.map(function(idx) {
      var p = knackState.players[idx];
      var info = computeKnackHandScore(p.hand);
      return { idx: idx, name: p.name, hand: p.hand.slice(), score: info.score, isDrilling: info.isDrilling, isPerfect: info.isPerfect };
    });
    var minScore = Math.min.apply(null, results.map(function(r){ return r.score; }));
    results.forEach(function(r) {
      r.lostLife = r.score === minScore;
      if (r.lostLife) {
        var p = knackState.players[r.idx];
        p.lives--;
        if (p.lives <= 0) { p.lives = 0; p.out = true; p.outRound = knackState.round; }
      }
    });
    knackState.roundResults = results;
    knackState.phase = 'roundEnd';
    render();
  }

  // ===================================================================
  // ---------- Schach (voll spielbar: 2 Spieler, ein Gerät) ----------
  // ===================================================================
  var SCHACH_HISTORY_KEY = 'schach_matches_v1';
  var schachSetupWhite = '';
  var schachSetupBlack = '';
  var schachState = {
    phase: 'setup', // setup | playing | recorded
    white: '',
    black: '',
    lastResult: null,
    resultReason: '',
    showHistory: false,
    board: null,
    turn: 'w',
    selected: null,
    legalTargets: [],
    lastMove: null,
    castling: {wK:true, wQ:true, bK:true, bQ:true},
    enPassant: null,
    capturedByWhite: [],
    capturedByBlack: [],
    moveHistory: [],
    flipped: false,
    pendingPromotion: null
  };

  // ---------- Chess engine ----------
  var CHESS_GLYPH = {
    wK:'♔', wQ:'♕', wR:'♖', wB:'♗', wN:'♘', wP:'♙',
    bK:'♚', bQ:'♛', bR:'♜', bB:'♝', bN:'♞', bP:'♟'
  };
  function chessInitialBoard() {
    return [
      ['bR','bN','bB','bQ','bK','bB','bN','bR'],
      ['bP','bP','bP','bP','bP','bP','bP','bP'],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      ['wP','wP','wP','wP','wP','wP','wP','wP'],
      ['wR','wN','wB','wQ','wK','wB','wN','wR']
    ];
  }
  function chessInBounds(r,c) { return r>=0 && r<8 && c>=0 && c<8; }
  function chessColorOf(p) { return p ? p[0] : null; }
  function chessTypeOf(p) { return p ? p[1] : null; }
  function chessOpponent(c) { return c === 'w' ? 'b' : 'w'; }
  function chessCloneBoard(board) { return board.map(function(row){ return row.slice(); }); }
  function chessSquareName(r,c) { return 'abcdefgh'[c] + (8-r); }

  function chessIsAttacked(board, r, c, byColor) {
    var pawnDr = byColor === 'w' ? 1 : -1;
    var dc;
    for (dc=-1; dc<=1; dc+=2) {
      var pr = r+pawnDr, pc = c+dc;
      if (chessInBounds(pr,pc) && board[pr][pc] === byColor+'P') return true;
    }
    var knightOffsets = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    var k;
    for (k=0;k<knightOffsets.length;k++) {
      var kr=r+knightOffsets[k][0], kc=c+knightOffsets[k][1];
      if (chessInBounds(kr,kc) && board[kr][kc] === byColor+'N') return true;
    }
    var dr;
    for (dr=-1; dr<=1; dr++) {
      for (dc=-1; dc<=1; dc++) {
        if (dr===0 && dc===0) continue;
        var kr2=r+dr, kc2=c+dc;
        if (chessInBounds(kr2,kc2) && board[kr2][kc2] === byColor+'K') return true;
      }
    }
    var diagDirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
    var d;
    for (d=0; d<diagDirs.length; d++) {
      var rr=r+diagDirs[d][0], cc=c+diagDirs[d][1];
      while (chessInBounds(rr,cc)) {
        var p = board[rr][cc];
        if (p) {
          if (chessColorOf(p)===byColor && (chessTypeOf(p)==='B' || chessTypeOf(p)==='Q')) return true;
          break;
        }
        rr+=diagDirs[d][0]; cc+=diagDirs[d][1];
      }
    }
    var straightDirs = [[-1,0],[1,0],[0,-1],[0,1]];
    var s;
    for (s=0; s<straightDirs.length; s++) {
      var rr2=r+straightDirs[s][0], cc2=c+straightDirs[s][1];
      while (chessInBounds(rr2,cc2)) {
        var p2 = board[rr2][cc2];
        if (p2) {
          if (chessColorOf(p2)===byColor && (chessTypeOf(p2)==='R' || chessTypeOf(p2)==='Q')) return true;
          break;
        }
        rr2+=straightDirs[s][0]; cc2+=straightDirs[s][1];
      }
    }
    return false;
  }
  function chessFindKing(board, color) {
    for (var r=0;r<8;r++) for (var c=0;c<8;c++) if (board[r][c] === color+'K') return {r:r,c:c};
    return null;
  }
  function chessInCheck(board, color) {
    var kp = chessFindKing(board, color);
    if (!kp) return false;
    return chessIsAttacked(board, kp.r, kp.c, chessOpponent(color));
  }

  function chessPseudoMoves(state, r, c) {
    var board = state.board;
    var piece = board[r][c];
    if (!piece) return [];
    var color = chessColorOf(piece), type = chessTypeOf(piece);
    var moves = [];
    function addIfOk(rr,cc) {
      if (!chessInBounds(rr,cc)) return false;
      var target = board[rr][cc];
      if (target && chessColorOf(target) === color) return false;
      moves.push({r:rr,c:cc,capture:!!target});
      return !target;
    }
    if (type === 'P') {
      var dir = color==='w' ? -1 : 1;
      var startRow = color==='w' ? 6 : 1;
      var lastRow = color==='w' ? 0 : 7;
      if (chessInBounds(r+dir,c) && !board[r+dir][c]) {
        moves.push({r:r+dir, c:c, capture:false, promotion:(r+dir===lastRow)});
        if (r===startRow && !board[r+2*dir][c]) {
          moves.push({r:r+2*dir, c:c, capture:false, doubleStep:true});
        }
      }
      [-1,1].forEach(function(dc) {
        var rr=r+dir, cc=c+dc;
        if (!chessInBounds(rr,cc)) return;
        var target = board[rr][cc];
        if (target && chessColorOf(target) !== color) {
          moves.push({r:rr,c:cc,capture:true, promotion:(rr===lastRow)});
        } else if (!target && state.enPassant && state.enPassant.r===rr && state.enPassant.c===cc) {
          moves.push({r:rr,c:cc,capture:true, enPassant:true});
        }
      });
    } else if (type === 'N') {
      [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(function(o) {
        addIfOk(r+o[0], c+o[1]);
      });
    } else if (type === 'K') {
      var dr2, dc2;
      for (dr2=-1; dr2<=1; dr2++) for (dc2=-1; dc2<=1; dc2++) {
        if (dr2===0 && dc2===0) continue;
        addIfOk(r+dr2, c+dc2);
      }
      var rights = state.castling;
      var homeRow = color==='w' ? 7 : 0;
      if (r===homeRow && c===4 && !chessInCheck(board, color)) {
        if ((color==='w'?rights.wK:rights.bK) && !board[homeRow][5] && !board[homeRow][6] && board[homeRow][7]===color+'R') {
          if (!chessIsAttacked(board,homeRow,5,chessOpponent(color)) && !chessIsAttacked(board,homeRow,6,chessOpponent(color))) {
            moves.push({r:homeRow, c:6, capture:false, castle:'K'});
          }
        }
        if ((color==='w'?rights.wQ:rights.bQ) && !board[homeRow][3] && !board[homeRow][2] && !board[homeRow][1] && board[homeRow][0]===color+'R') {
          if (!chessIsAttacked(board,homeRow,3,chessOpponent(color)) && !chessIsAttacked(board,homeRow,2,chessOpponent(color))) {
            moves.push({r:homeRow, c:2, capture:false, castle:'Q'});
          }
        }
      }
    } else {
      var dirs = [];
      if (type==='B' || type==='Q') dirs = dirs.concat([[-1,-1],[-1,1],[1,-1],[1,1]]);
      if (type==='R' || type==='Q') dirs = dirs.concat([[-1,0],[1,0],[0,-1],[0,1]]);
      dirs.forEach(function(dir) {
        var rr=r+dir[0], cc=c+dir[1];
        while (chessInBounds(rr,cc)) {
          var cont = addIfOk(rr,cc);
          if (!cont) break;
          rr+=dir[0]; cc+=dir[1];
        }
      });
    }
    return moves;
  }
  function chessSimulateMove(state, from, to, meta) {
    var board = chessCloneBoard(state.board);
    var piece = board[from.r][from.c];
    var color = chessColorOf(piece);
    if (meta.enPassant) board[from.r][to.c] = null;
    board[to.r][to.c] = piece;
    board[from.r][from.c] = null;
    if (meta.castle === 'K') { board[from.r][5] = board[from.r][7]; board[from.r][7] = null; }
    else if (meta.castle === 'Q') { board[from.r][3] = board[from.r][0]; board[from.r][0] = null; }
    if (meta.promotion) board[to.r][to.c] = color + (meta.promoteTo || 'Q');
    return board;
  }
  function chessLegalMoves(state, r, c) {
    var piece = state.board[r][c];
    if (!piece) return [];
    var color = chessColorOf(piece);
    var pseudo = chessPseudoMoves(state, r, c);
    return pseudo.filter(function(m) {
      var simBoard = chessSimulateMove(state, {r:r,c:c}, {r:m.r,c:m.c}, m);
      return !chessInCheck(simBoard, color);
    });
  }
  function chessAllLegalMoves(state, color) {
    var all = [];
    for (var r=0;r<8;r++) for (var c=0;c<8;c++) {
      var p = state.board[r][c];
      if (p && chessColorOf(p)===color) {
        chessLegalMoves(state, r, c).forEach(function(m) {
          all.push({from:{r:r,c:c}, to:{r:m.r,c:m.c}, meta:m});
        });
      }
    }
    return all;
  }

  function initSchachGameState() {
    schachState.board = chessInitialBoard();
    schachState.turn = 'w';
    schachState.selected = null;
    schachState.legalTargets = [];
    schachState.lastMove = null;
    schachState.castling = {wK:true, wQ:true, bK:true, bQ:true};
    schachState.enPassant = null;
    schachState.capturedByWhite = [];
    schachState.capturedByBlack = [];
    schachState.moveHistory = [];
    schachState.flipped = false;
    schachState.pendingPromotion = null;
  }

  function schachApplyMove(from, to, meta, promoteTo) {
    var state = schachState;
    var board = state.board;
    var piece = board[from.r][from.c];
    var color = chessColorOf(piece);
    var captured = board[to.r][to.c];
    var isCapture = !!captured || !!meta.enPassant;

    if (meta.enPassant) {
      captured = board[from.r][to.c];
      board[from.r][to.c] = null;
    }
    board[to.r][to.c] = piece;
    board[from.r][from.c] = null;

    var notation = chessSquareName(from.r,from.c) + (isCapture?'x':'-') + chessSquareName(to.r,to.c);

    if (meta.castle === 'K') {
      board[from.r][5] = board[from.r][7];
      board[from.r][7] = null;
      notation = 'O-O';
    } else if (meta.castle === 'Q') {
      board[from.r][3] = board[from.r][0];
      board[from.r][0] = null;
      notation = 'O-O-O';
    }
    if (meta.promotion) {
      board[to.r][to.c] = color + (promoteTo || 'Q');
      notation += '=' + (promoteTo || 'Q');
    }

    if (chessTypeOf(piece) === 'K') {
      if (color==='w') { state.castling.wK=false; state.castling.wQ=false; } else { state.castling.bK=false; state.castling.bQ=false; }
    }
    if (from.r===7 && from.c===0) state.castling.wQ=false;
    if (from.r===7 && from.c===7) state.castling.wK=false;
    if (from.r===0 && from.c===0) state.castling.bQ=false;
    if (from.r===0 && from.c===7) state.castling.bK=false;
    if (to.r===7 && to.c===0) state.castling.wQ=false;
    if (to.r===7 && to.c===7) state.castling.wK=false;
    if (to.r===0 && to.c===0) state.castling.bQ=false;
    if (to.r===0 && to.c===7) state.castling.bK=false;

    state.enPassant = meta.doubleStep ? {r:(from.r+to.r)/2, c:from.c} : null;

    if (captured) {
      if (color === 'w') state.capturedByWhite.push(captured); else state.capturedByBlack.push(captured);
    }

    state.moveHistory.push(notation);
    state.lastMove = {from:from, to:to};
    state.selected = null;
    state.legalTargets = [];
    state.turn = chessOpponent(color);

    var opp = state.turn;
    var oppMoves = chessAllLegalMoves(state, opp);
    var oppInCheck = chessInCheck(state.board, opp);
    if (oppMoves.length === 0) {
      if (oppInCheck) finishSchachGame(color === 'w' ? 'white' : 'black', 'Matt');
      else finishSchachGame('draw', 'Patt');
    }
  }
  function finishSchachGame(result, reason) {
    recordSchachMatch(result);
    schachState.lastResult = result;
    schachState.resultReason = reason;
    schachState.phase = 'recorded';
    render();
  }
  function schachSelectSquare(r, c) {
    var state = schachState;
    if (state.pendingPromotion) return;
    var piece = state.board[r][c];
    if (state.selected) {
      var target = state.legalTargets.filter(function(t){ return t.r===r && t.c===c; })[0];
      if (target) {
        if (target.promotion) {
          state.pendingPromotion = { from: state.selected, to: {r:r,c:c}, meta: target };
          render();
          return;
        }
        schachApplyMove(state.selected, {r:r,c:c}, target);
        render();
        return;
      }
    }
    if (piece && chessColorOf(piece) === state.turn) {
      state.selected = {r:r,c:c};
      state.legalTargets = chessLegalMoves(state, r, c);
    } else {
      state.selected = null;
      state.legalTargets = [];
    }
    render();
  }
  function schachChoosePromotion(pieceType) {
    var pp = schachState.pendingPromotion;
    schachState.pendingPromotion = null;
    schachApplyMove(pp.from, pp.to, pp.meta, pieceType);
    render();
  }

  function loadSchachHistory() {
    try {
      var raw = localStorage.getItem(SCHACH_HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }
  function saveSchachHistory(list) {
    try { localStorage.setItem(SCHACH_HISTORY_KEY, JSON.stringify(list)); } catch(e) {}
  }
  function recordSchachMatch(result) {
    var match = {
      id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      date: new Date().toISOString(),
      white: schachState.white,
      black: schachState.black,
      result: result // 'white' | 'black' | 'draw'
    };
    var history = loadSchachHistory();
    history.unshift(match);
    if (history.length > 200) history = history.slice(0, 200);
    saveSchachHistory(history);
  }
  function computeSchachStats(history) {
    var stats = {};
    function ensure(name) {
      if (!stats[name]) stats[name] = {name:name, games:0, wins:0, draws:0, losses:0};
      return stats[name];
    }
    history.forEach(function(m) {
      var w = ensure(m.white), b = ensure(m.black);
      w.games++; b.games++;
      if (m.result === 'white') { w.wins++; b.losses++; }
      else if (m.result === 'black') { b.wins++; w.losses++; }
      else { w.draws++; b.draws++; }
    });
    return Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b) {
      return b.wins - a.wins || b.games - a.games;
    });
  }
  function matchLineSchach(m) {
    if (m.result === 'draw') return escapeHtml(m.white) + ' 🤝 ' + escapeHtml(m.black);
    if (m.result === 'white') return '👑 ' + escapeHtml(m.white) + ' vs ' + escapeHtml(m.black);
    return escapeHtml(m.white) + ' vs 👑 ' + escapeHtml(m.black);
  }

  // ===================================================================

  // ---------- Karten ----------
  // 52 Karten: 0 und 13 je 2×, 1–12 je 4×
  var CABO_ART = ['🦄','🐞','🐣','🐸','🐢','🦊','🐧','🦉','🐙','🦜','🦇','🐍','💎','🐉'];
  var CABO_ART_NAME = ['Einhorn','Herbstblatt','Katzenpaar','Spargel','Vögel','Fallschirme','Mäuse','Kois · Peek','Krake · Peek','Brille · Spy','Melone · Spy','Hund · Swap','Kristalle · Swap','Kleber'];
  var CABO_COLORS = [
    ['#7fd6f5','#3aa7d9'], ['#9be06a','#4fae2c'], ['#b6e35a','#6fb21e'], ['#d7e84a','#98b40f'],
    ['#f3e04a','#c9a70a'], ['#ffd23f','#e39b00'], ['#ffba3f','#e57a00'], ['#ffa24a','#e0601a'],

    ['#a98bf5','#5b3fc4'], ['#6e7bd9','#2d3589']

  function caboCardPower(card) {
    if (card.value === 7 || card.value === 8) return 'peek';
    if (card.value === 9 || card.value === 10) return 'spy';
    if (card.value === 11 || card.value === 12) return 'swap';

  var CABO_POWER_LABEL = { peek: 'PEEK', spy: 'SPY', swap: 'SWAP' };

  function buildCaboDeck() {
    var deck = [], id = 0;
    for (var v = 0; v <= 13; v++) {
      var n = (v === 0 || v === 13) ? 2 : 4;
      for (var i = 0; i < n; i++) deck.push({ value: v, id: 'c' + (id++) });
    }
    return deck;
  }
  // ---------- Cabo-Kartenillustrationen (eigene Nachzeichnungen im Stil des Originals) ----------
  // Jede Karte ist ein SVG-Symbol (viewBox 0 0 100 140), das einmalig in <defs> eingefügt wird.
  function caboRng(seed) { var s = seed >>> 0; return function() { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function cbR(n) { return Math.round(n * 10) / 10; }
  var CABO_NUM_COLOR = ['#4f8fe0','#f3e6d0','#6b4a3a','#3a3a2a','#f6d7a0','#3a3040','#e8c77a','#fff4f0','#6f8497','#4a3a40','#4a3a40','#f3ead8','#fff8e8','#6aa8ee'];

  function loadCaboHistory() {
    try {
      var raw = localStorage.getItem(CABO_HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }
  function saveCaboHistory(list) {
    try { localStorage.setItem(CABO_HISTORY_KEY, JSON.stringify(list)); } catch(e) {}
  }
  function recordCaboMatch() {
    if (caboState.matchRecorded) return;
    caboState.matchRecorded = true;
    var results = caboState.players.map(function(p){ return {name:p.name, total:p.total}; });
    var minTotal = Math.min.apply(null, results.map(function(r){return r.total;}));
    var winners = results.filter(function(r){return r.total===minTotal;}).map(function(r){return r.name;});
    var match = {
      id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      date: new Date().toISOString(),
      rounds: caboState.round,
      players: results,
      winners: winners
    };
    var history = loadCaboHistory();
    history.unshift(match);
    if (history.length > 200) history = history.slice(0, 200);
    saveCaboHistory(history);
  }
  function computeCaboStats(history) {
    var stats = {};
    history.forEach(function(m) {
      m.players.forEach(function(p) {
        if (!stats[p.name]) stats[p.name] = {name:p.name, games:0, wins:0, totalScore:0};
        var s = stats[p.name];
        s.games++;
        s.totalScore += p.total;
        if (m.winners.indexOf(p.name) !== -1) s.wins++;
      });
    });
    return Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b){
      return b.wins - a.wins || a.totalScore - b.totalScore;
    });
  }
  function matchLineCabo(m) {
    var sorted = m.players.slice().sort(function(a,b){return a.total-b.total;});
    return sorted.map(function(p) {
      var won = m.winners.indexOf(p.name) !== -1;
      return (won ? '👑 ' : '') + escapeHtml(p.name) + ' ' + p.total;
    }).join(' · ');
  }

    if (caboState.phase === 'setup') renderCaboSetup();
    else if (caboState.phase === 'peek') renderCaboPeek();
    else if (caboState.phase === 'interstitial') renderCaboInterstitial();
    else if (caboState.phase === 'turn') renderCaboTurnDispatch();
    else if (caboState.phase === 'roundEnd') renderCaboRoundEnd();
    else if (caboState.phase === 'finished') renderCaboFinished();

    if (caboState.showHistory) renderCaboHistoryOverlay();
  }

      if (caboSetupNames.length < 6) { caboSetupNames.push(''); render(); }

  function startCabo() {
    var names = caboSetupNames.map(function(n, i){ return n.trim() || ('Spieler ' + (i+1)); });
    if (names.length < 2) names = names.concat(['Spieler 2']);
    caboState.players = names.map(function(n) { return { name: n, hand: [], total: 0 }; });
    caboState.round = 1;
    caboState.roundStartOffset = 0;
    caboState.matchRecorded = false;
    dealCaboRound();
    render();
  }

  function caboNewGameConfirm() {
    if (confirm('Neues Spiel starten? Der aktuelle Fortschritt geht verloren.')) {
      caboState.phase = 'setup';
      render();
    }
  }

  function dealCaboRound() {
    var deck = shuffleDeck(buildCaboDeck());
    caboState.players.forEach(function(p) {
      p.hand = [deck.pop(), deck.pop(), deck.pop(), deck.pop()];
    });
    caboState.discard = [deck.pop()];
    caboState.deck = deck;
    var n = caboState.players.length;
    var startPos = caboState.roundStartOffset % n;
    caboState.order = [];
    for (var i = 0; i < n; i++) caboState.order.push((startPos + i) % n);
    caboState.turnPointer = 0;
    caboState.caboCallerOrder = -1;
    caboState.turnsLeftAfterCabo = 0;
    caboState.drawn = null;
    caboState.selected = [];
    caboState.power = null;
    caboState.notice = null;
    caboState.roundResults = null;
    caboState.peekQueueIdx = 0;
    caboState.peekSeen = false;
    caboState.phase = 'peek';
  }

  }
  function caboCallNoteHtml() {
    if (caboState.caboCallerOrder === -1) return '';
    return '<p class="cabo-call-note">📣 Letzte Runde – ' + escapeHtml(caboState.players[caboState.order[caboState.caboCallerOrder]].name) + ' hat CABO gerufen!</p>';
  }

  // Eigene Karten als 2×2-Raster (obere Reihe = von dir weg, untere Reihe = nah bei dir)
  function caboHandGridHtml(hand, opts) {
    opts = opts || {};
    var html = '<div class="cabo-hand' + (opts.small ? ' small' : '') + '"' + (opts.id ? ' id="' + opts.id + '"' : '') + '>';
    hand.forEach(function(c, i) {
      var faceUp = opts.faceUp ? opts.faceUp(i) : false;
      html += caboCardHtml(c, {
        size: opts.small ? 'sm' : 'md', back: !faceUp,
        clickable: opts.clickable ? opts.clickable(i) : false,
        selected: opts.selected ? opts.selected(i) : false,
        attrs: ' data-idx="' + i + '"' + (opts.pIdx !== undefined ? ' data-p="' + opts.pIdx + '" data-c="' + i + '"' : '')
      });
    });
    html += '</div>';
    return html;
  }

  function renderCaboPeek() {
    var pIdx = caboState.order[caboState.peekQueueIdx];
    var player = caboState.players[pIdx];
    subtitle.textContent = 'Runde ' + caboState.round + ' · Karten merken';

    if (!caboState.peekSeen) {
      main.innerHTML = caboPassScreenHtml(player, 'caboPeekRevealBtn', '👁️ Meine 2 Karten ansehen');
      document.getElementById('caboPeekRevealBtn').addEventListener('click', function() { caboState.peekSeen = true; render(); });
      document.getElementById('caboNewGameBtn').addEventListener('click', caboNewGameConfirm);
      return;
    }

    var html = '<div class="card" style="text-align:center">';
    html += '<h2 class="section-title" style="margin-top:0">🧠 Präg dir deine zwei unteren Karten ein</h2>';
    html += '<div class="cabo-felt">' + caboHandGridHtml(player.hand, { faceUp: function(i) { return i >= 2; } }) + '</div>';
    html += '<p class="hint">Die oberen zwei kennst du noch nicht. Gleich werden alle wieder verdeckt.</p>';
    html += '<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" id="caboPeekDoneBtn">Gemerkt, weiter</button></div>';
    html += '</div>';
    main.innerHTML = html;
    document.getElementById('caboPeekDoneBtn').addEventListener('click', function() {
      caboState.peekQueueIdx++;
      caboState.peekSeen = false;
      if (caboState.peekQueueIdx >= caboState.order.length) {
        caboState.phase = 'interstitial';
        caboState.pendingReveal = caboState.order[0];
      }
      render();
    });
  }

  function renderCaboInterstitial() {
    var player = caboState.players[caboState.pendingReveal];
    subtitle.textContent = 'Runde ' + caboState.round;
    main.innerHTML = caboPassScreenHtml(player, 'caboRevealBtn', '👁️ Los geht\'s', caboCallNoteHtml());
    document.getElementById('caboRevealBtn').addEventListener('click', function() { caboState.phase = 'turn'; render(); });
    document.getElementById('caboNewGameBtn').addEventListener('click', caboNewGameConfirm);
  }

  // Spieltisch: Mitspieler oben, Stapel in der Mitte, eigene Karten unten.
  // o: {oppClickable(p,c), oppSelected(p,c), ownClickable(i), ownSelected(i), ownFaceUp(i), center}
  function caboTableHtml(o) {
    o = o || {};
    var curIdx = caboState.order[caboState.turnPointer];
    var me = caboState.players[curIdx];
    var callerIdx = caboState.caboCallerOrder !== -1 ? caboState.order[caboState.caboCallerOrder] : -1;
    var html = '<div class="cabo-felt cabo-table">';
    html += '<div class="cabo-opps">';
    caboState.players.forEach(function(p, pIdx) {
      if (pIdx === curIdx) return;
      html += '<div class="cabo-opp">';
      html += '<div class="cabo-opp-name">' + escapeHtml(p.name) + (pIdx === callerIdx ? ' 📣' : '') + ' <small>' + p.total + ' Pkt</small></div>';
      html += caboHandGridHtml(p.hand, {
        small: true, pIdx: pIdx,
        clickable: o.oppClickable ? function(c) { return o.oppClickable(pIdx, c); } : null,
        selected: o.oppSelected ? function(c) { return o.oppSelected(pIdx, c); } : null
      });
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="cabo-center">' + (o.center || caboPilesHtml()) + '</div>';

    html += '<div class="cabo-me">';
    html += '<div class="cabo-me-label">Deine Karten' + (me.hand.length !== 4 ? ' (' + me.hand.length + ')' : '') + '</div>';
    html += caboHandGridHtml(me.hand, { id: 'caboOwnHand', pIdx: curIdx, clickable: o.ownClickable, selected: o.ownSelected, faceUp: o.ownFaceUp });
    html += '</div>';
    html += '</div>';
    return html;
  }
  function caboPilesHtml(drawnHtml) {
    var top = caboState.discard[caboState.discard.length - 1];
    var html = '<div class="cabo-pile"><div class="cabo-pile-stack">' + caboCardHtml(null, {size:'md', back:true, attrs:' id="caboDeckCard"'}) +
      '<span class="cabo-pile-count">' + caboState.deck.length + '</span></div><small>Stapel</small></div>';
    html += '<div class="cabo-pile">' + (top ? caboCardHtml(top, {size:'md', attrs:' id="caboDiscardCard"'}) : '<div class="cabo-card md empty"></div>') + '<small>Ablage</small></div>';
    if (drawnHtml) html += drawnHtml;
    return html;
  }
  function caboLegendHtml() {
    return '<div class="cabo-legend"><span>👁️ 7–8 Peek</span><span>🔍 9–10 Spy</span><span>🔄 11–12 Swap</span></div>';
  }
  function caboBannerHtml(player, right) {
    return '<div class="turn-banner cabo-banner"><div class="who">🎴 ' + escapeHtml(player.name) + '</div><div class="rolls">' + right + '</div></div>';
  }

  function renderCaboTurnDispatch() {
    if (caboState.notice) { renderCaboNotice(); return; }
    if (caboState.power) { renderCaboPower(); return; }
    if (caboState.drawn) { renderCaboDecide(); return; }
    renderCaboDraw();
  }

  function renderCaboDraw() {
    var pIdx = caboState.order[caboState.turnPointer];
    var player = caboState.players[pIdx];
    subtitle.textContent = player.name + ' ist dran · Runde ' + caboState.round;

    var html = caboBannerHtml(player, 'Runde ' + caboState.round + ' · ' + player.total + ' Pkt');
    html += caboCallNoteHtml();
    html += caboTableHtml();
    html += '<div class="cabo-actions">';
    html += '<button class="btn btn-primary" id="caboDrawDeckBtn">🂠 Vom Stapel ziehen</button>';
    html += '<button class="btn btn-secondary" id="caboDrawDiscardBtn"' + (caboState.discard.length ? '' : ' disabled') + '>♻️ Ablage nehmen</button>';
    html += '<button class="btn cabo-call-btn" id="caboCallBtn"' + (caboState.caboCallerOrder !== -1 ? ' disabled' : '') + '>📣 CABO!</button>';
    html += '</div>';
    html += '<div class="hint">Tipp: Du kannst auch direkt auf den Stapel oder die Ablage tippen.</div>';
    html += caboLegendHtml();
    html += '<div class="footer-actions"><button class="btn btn-ghost" id="caboNewGameBtn">Neues Spiel</button></div>';
    main.innerHTML = html;

    document.getElementById('caboDrawDeckBtn').addEventListener('click', function() { caboDraw('deck'); });
    document.getElementById('caboDeckCard').addEventListener('click', function() { caboDraw('deck'); });
    var discardBtn = document.getElementById('caboDrawDiscardBtn');
    if (discardBtn) discardBtn.addEventListener('click', function() { caboDraw('discard'); });
    var discardCard = document.getElementById('caboDiscardCard');
    if (discardCard) discardCard.addEventListener('click', function() { caboDraw('discard'); });
    document.getElementById('caboCallBtn').addEventListener('click', function() {
      if (confirm('Wirklich CABO rufen? Alle anderen haben dann noch einen Zug.')) caboCallCabo();
    });
    document.getElementById('caboNewGameBtn').addEventListener('click', caboNewGameConfirm);
  }

  function caboEnsureDeck() {
    if (caboState.deck.length === 0) {
      if (caboState.discard.length <= 1) {
        caboState.deck = shuffleDeck(buildCaboDeck());
        return;
      }
      var top = caboState.discard.pop();
      caboState.deck = shuffleDeck(caboState.discard);
      caboState.discard = [top];
    }
  }
  function caboDraw(source) {
    if (source === 'deck') {
      caboEnsureDeck();
      caboState.drawn = { card: caboState.deck.pop(), source: 'deck' };
    } else {
      if (!caboState.discard.length) return;
      caboState.drawn = { card: caboState.discard.pop(), source: 'discard' };
    }
    caboState.selected = [];
    render();
  }

  function renderCaboDecide() {
    var pIdx = caboState.order[caboState.turnPointer];
    var player = caboState.players[pIdx];
    var drawn = caboState.drawn;
    var power = caboCardPower(drawn.card);
    subtitle.textContent = player.name + ' entscheidet';
    var sel = caboState.selected;

    var drawnHtml = '<div class="cabo-pile cabo-drawn">' + caboCardHtml(drawn.card, {size:'lg'}) + '<small>' + (drawn.source === 'deck' ? 'Gezogen' : 'Von der Ablage') + '</small></div>';
    var html = caboBannerHtml(player, drawn.source === 'deck' ? 'vom Stapel gezogen' : 'von der Ablage genommen');
    html += caboCallNoteHtml();
    html += caboTableHtml({
      center: caboPilesHtml(drawnHtml),
      ownClickable: function() { return true; },
      ownSelected: function(i) { return sel.indexOf(i) !== -1; }
    });
    html += '<div class="cabo-actions">';
    html += '<button class="btn btn-primary" id="caboSwapBtn"' + (sel.length ? '' : ' disabled') + '>🔁 ' +
      (sel.length > 1 ? sel.length + ' gleiche tauschen' : 'Tauschen') + '</button>';
    if (drawn.source === 'deck') {
      html += '<button class="btn ' + (power ? 'btn-secondary' : 'btn-ghost') + '" id="caboDiscardDirectBtn">🗑️ Ablegen' + (power ? ' &amp; ' + CABO_POWER_ICON[power] + ' ' + CABO_POWER_LABEL[power] : '') + '</button>';
    }
    html += '</div>';
    html += '<div class="hint">Tippe eine deiner Karten an (oder mehrere, wenn du glaubst, dass sie gleich sind).' +
      (drawn.source === 'discard' ? ' Karten von der Ablage müssen getauscht werden.' : '') + '</div>';
    html += caboLegendHtml();
    main.innerHTML = html;

    document.querySelectorAll('#caboOwnHand .cabo-card').forEach(function(el) {
      el.addEventListener('click', function() {
        var i = Number(this.dataset.idx);
        var at = sel.indexOf(i);
        if (at === -1) sel.push(i); else sel.splice(at, 1);
        render();
      });
    });
    document.getElementById('caboSwapBtn').addEventListener('click', caboPlaceSwap);
    var db = document.getElementById('caboDiscardDirectBtn');
    if (db) db.addEventListener('click', caboDiscardDrawnDirect);
  }

  function caboPlaceSwap() {
    var pIdx = caboState.order[caboState.turnPointer];
    var player = caboState.players[pIdx];
    var sel = caboState.selected.slice().sort(function(a, b) { return a - b; });
    if (!sel.length) return;
    var chosen = sel.map(function(i) { return player.hand[i]; });
    var drawnCard = caboState.drawn.card;
    if (sel.length > 1 && !chosen.every(function(c) { return c.value === chosen[0].value; })) {
      // Fehlversuch: alles bleibt liegen, die gezogene Karte kommt auf die Ablage
      caboState.discard.push(drawnCard);
      caboState.drawn = null;
      caboState.selected = [];
      caboState.notice = { title: '❌ Nicht gleich!', text: 'Die gewählten Karten sind unterschiedlich – sie bleiben bei dir liegen, die gezogene Karte kommt auf die Ablage. (Alle haben die Karten gesehen.)', cards: chosen };
      render();
      return;
    }
    // gewählte Karten ablegen, gezogene Karte kommt an die erste Position
    var newHand = [];
    player.hand.forEach(function(c, i) {
      if (i === sel[0]) newHand.push(drawnCard);
      else if (sel.indexOf(i) === -1) newHand.push(c);
    });
    chosen.forEach(function(c) { caboState.discard.push(c); });
    player.hand = newHand;
    caboState.drawn = null;
    caboState.selected = [];
    if (sel.length > 1) {
      caboState.notice = { title: '✅ Passt!', text: sel.length + ' gleiche Karten abgelegt – du hast jetzt nur noch ' + newHand.length + ' Karte' + (newHand.length === 1 ? '' : 'n') + '.', cards: chosen };
      render();
      return;
    }
    caboAdvanceTurn();
  }

  function renderCaboNotice() {
    var n = caboState.notice;
    var html = '<div class="card" style="text-align:center">';
    html += '<h2 class="section-title" style="margin-top:0;font-size:19px;color:var(--ink);text-transform:none;letter-spacing:0">' + n.title + '</h2>';
    html += '<div class="cabo-felt"><div class="card-row">' + n.cards.map(function(c) { return caboCardHtml(c, {size:'md'}); }).join('') + '</div></div>';
    html += '<p class="hint">' + n.text + '</p>';
    html += '<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" id="caboNoticeOk">Weiter</button></div>';
    html += '</div>';
    main.innerHTML = html;
    document.getElementById('caboNoticeOk').addEventListener('click', function() {
      caboState.notice = null;
      caboAdvanceTurn();
    });
  }

  function caboDiscardDrawnDirect() {
    var card = caboState.drawn.card;
    caboState.discard.push(card);
    caboState.drawn = null;
    caboState.selected = [];
    var power = caboCardPower(card);
    if (power) {
      caboState.power = { type: power, picks: [] };
      render();
    } else {
      caboAdvanceTurn();
    }
  }

  function renderCaboPower() {
    var pIdx = caboState.order[caboState.turnPointer];
    var player = caboState.players[pIdx];
    var pw = caboState.power;
    subtitle.textContent = player.name + ' nutzt ' + CABO_POWER_LABEL[pw.type];

    if (pw.reveal) {
      var html2 = '<div class="card" style="text-align:center">';
      html2 += '<h2 class="section-title" style="margin-top:0">' + CABO_POWER_ICON[pw.type] + ' ' + pw.revealLabel + '</h2>';
      html2 += '<div class="cabo-felt"><div class="card-row">' + caboCardHtml(pw.reveal, {size:'lg'}) + '</div></div>';
      html2 += '<p class="hint">Gut merken – gleich ist sie wieder verdeckt.</p>';
      html2 += '<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" id="caboPowerContinueBtn">Gemerkt, weiter</button></div>';
      html2 += '</div>';
      main.innerHTML = html2;
      document.getElementById('caboPowerContinueBtn').addEventListener('click', function() {
        caboState.power = null;
        caboAdvanceTurn();
      });
      return;
    }

    var title = '', hint = '';
    var ownPick = pw.picks.filter(function(pk) { return pk.p === pIdx; })[0];
    if (pw.type === 'peek') { title = '👁️ PEEK – schau dir eine eigene Karte an'; hint = 'Tippe eine deiner Karten an.'; }
    else if (pw.type === 'spy') { title = '🔍 SPY – schau dir eine fremde Karte an'; hint = 'Tippe eine Karte eines Mitspielers an.'; }
    else { title = '🔄 SWAP – blind tauschen'; hint = ownPick ? 'Jetzt eine Karte eines Mitspielers antippen.' : 'Erst eine deiner Karten antippen, dann eine fremde.'; }

    var html = caboBannerHtml(player, title);
    html += caboTableHtml({
      ownClickable: function(i) { return pw.type === 'peek' || (pw.type === 'swap' && !ownPick); },
      ownSelected: function(i) { return !!ownPick && ownPick.c === i; },
      oppClickable: function(p, c) { return pw.type === 'spy' || (pw.type === 'swap' && !!ownPick); }
    });
    html += '<div class="hint">' + hint + '</div>';
    html += '<div class="footer-actions"><button class="btn btn-ghost" id="caboSkipPowerBtn">Aktion verfallen lassen</button></div>';
    main.innerHTML = html;

    document.querySelectorAll('.cabo-table .cabo-card.clickable').forEach(function(el) {
      el.addEventListener('click', function() { caboPowerPick(Number(this.dataset.p), Number(this.dataset.c)); });
    });
    document.getElementById('caboSkipPowerBtn').addEventListener('click', function() {
      caboState.power = null;
      caboAdvanceTurn();
    });
  }

  function caboPowerPick(p, c) {
    var pw = caboState.power;
    var pIdx = caboState.order[caboState.turnPointer];
    if (pw.type === 'peek' || pw.type === 'spy') {
      pw.reveal = caboState.players[p].hand[c];
      pw.revealLabel = (p === pIdx ? 'Deine Karte' : escapeHtml(caboState.players[p].name) + 's Karte');
      render();
      return;
    }
    pw.picks.push({p:p, c:c});
    if (pw.picks.length === 2) {
      var a = pw.picks[0], b = pw.picks[1];
      var tmp = caboState.players[a.p].hand[a.c];
      caboState.players[a.p].hand[a.c] = caboState.players[b.p].hand[b.c];
      caboState.players[b.p].hand[b.c] = tmp;
      caboState.power = null;
      caboAdvanceTurn();
      return;
    }
    render();
  }

  function caboAdvanceTurn() {
    if (caboState.caboCallerOrder !== -1) {
      caboState.turnsLeftAfterCabo--;
    }
    if (caboState.caboCallerOrder !== -1 && caboState.turnsLeftAfterCabo <= 0) {
      finishCaboRound();
      return;
    }
    caboState.turnPointer = (caboState.turnPointer + 1) % caboState.order.length;
    caboState.drawn = null;
    caboState.power = null;
    caboState.selected = [];
    caboState.phase = 'interstitial';
    caboState.pendingReveal = caboState.order[caboState.turnPointer];
    render();
  }

  function caboCallCabo() {
    caboState.caboCallerOrder = caboState.turnPointer;
    caboState.turnsLeftAfterCabo = caboState.order.length - 1;
    caboState.drawn = null;
    caboState.power = null;
    if (caboState.turnsLeftAfterCabo <= 0) { finishCaboRound(); return; }
    caboState.turnPointer = (caboState.turnPointer + 1) % caboState.order.length;
    caboState.phase = 'interstitial';
    caboState.pendingReveal = caboState.order[caboState.turnPointer];
    render();
  }

  function caboIsKamikaze(hand) {
    if (hand.length !== 4) return false;
    var v = hand.map(function(c) { return c.value; }).sort(function(a, b) { return a - b; });
    return v[0] === 12 && v[1] === 12 && v[2] === 13 && v[3] === 13;
  }

  function finishCaboRound() {
    var callerIdx = caboState.caboCallerOrder !== -1 ? caboState.order[caboState.caboCallerOrder] : -1;
    var results = caboState.players.map(function(p, idx) {
      return { idx: idx, name: p.name, hand: p.hand.slice(), sum: caboHandSum(p.hand), notes: [] };
    });
    var kamikaze = results.filter(function(r) { return caboIsKamikaze(r.hand); })[0];
    var minSum = Math.min.apply(null, results.map(function(r) { return r.sum; }));
    results.forEach(function(r) {
      if (kamikaze) {
        r.points = r === kamikaze ? 0 : 50;
        r.notes.push(r === kamikaze ? '💥 Kamikaze!' : 'Kamikaze-Opfer');
        return;
      }
      if (r.sum === minSum) { r.points = 0; r.notes.push('🥇 niedrigste Summe'); }
      else r.points = r.sum;
      if (r.idx === callerIdx && r.sum > minSum) { r.points += CABO_CALL_PENALTY; r.notes.push('+' + CABO_CALL_PENALTY + ' Strafe'); }
    });
    results.forEach(function(r) {
      var p = caboState.players[r.idx];
      p.total += r.points;
      if (p.total === CABO_LIMIT) { p.total = 50; r.notes.push('🎯 genau 100 → 50'); }
      r.total = p.total;
    });
    caboState.roundResults = { results: results, callerIdx: callerIdx };
    caboState.phase = 'roundEnd';
    render();
  }

  function renderCaboRoundEnd() {
    subtitle.textContent = 'Runde ' + caboState.round + ' beendet';
    var rr = caboState.roundResults;
    var results = rr.results.slice().sort(function(a, b) { return a.sum - b.sum; });
    var html = '<div class="card">';
    html += '<h2 class="section-title" style="margin-top:0">🕵️ Aufdecken!</h2>';
    results.forEach(function(r) {
      html += '<div class="cabo-result' + (r.points === 0 ? ' best' : '') + '">';
      html += '<div class="cabo-result-head"><span class="knack-player-name">' + escapeHtml(r.name) + (r.idx === rr.callerIdx ? ' 📣' : '') + '</span>' +
        '<span class="cabo-result-pts">Summe ' + r.sum + ' → <b>+' + r.points + '</b></span></div>';
      html += '<div class="card-row" style="justify-content:flex-start;margin:6px 0">' + r.hand.map(function(c) { return caboCardHtml(c, {size:'sm'}); }).join('') + '</div>';
      html += '<div class="cabo-result-foot"><span>' + r.notes.join(' · ') + '</span><span>Gesamt: <b>' + r.total + '</b></span></div>';
      html += '</div>';
    });
    var over = caboState.players.some(function(p) { return p.total > CABO_LIMIT; });
    html += '<div class="btn-row" style="margin-top:16px"><button class="btn btn-primary" id="caboContinueBtn" style="flex:1">' + (over ? '🏁 Zum Ergebnis' : 'Nächste Runde') + '</button></div>';
    html += '</div>';
    main.innerHTML = html;
    document.getElementById('caboContinueBtn').addEventListener('click', function() {
      if (caboState.players.some(function(p) { return p.total > CABO_LIMIT; })) {
        caboState.phase = 'finished';
        recordCaboMatch();
        render();
        return;
      }
      caboState.round++;
      caboState.roundStartOffset++;
      dealCaboRound();
      render();
    });
  }

  function renderCaboFinished() {
    subtitle.textContent = 'Partie beendet';
    var html = '<div class="card"><div class="knack-players">';
    caboState.players.slice().sort(function(a, b) { return a.total - b.total; }).forEach(function(p) {
      html += '<div class="knack-player" style="cursor:default"><span class="knack-player-name">' + escapeHtml(p.name) + '</span><span style="font-weight:800;color:var(--accent2)">' + p.total + ' Pkt</span></div>';
    });
    html += '</div></div>';
    main.innerHTML = html;
    renderCaboWinnerOverlay();
  }

  function renderCaboWinnerOverlay() {
    var sorted = caboState.players.slice().sort(function(a, b) { return a.total - b.total; });
    var minTotal = sorted[0].total;
    var winners = caboState.players.filter(function(p) { return p.total === minTotal; });
    var html = '<div class="overlay"><div class="card">';
    html += '<div class="trophy">🏆</div>';
    html += '<h2>🎉 ' + winners.map(function(p) { return escapeHtml(p.name); }).join(' & ') + ' gewinnt!</h2>';
    html += '<div style="color:var(--ink-soft);font-size:14px">wenigste Punkte nach ' + caboState.round + ' Runden</div>';
    html += '<div class="final-list">';
    sorted.forEach(function(p) { html += '<div><span>' + escapeHtml(p.name) + '</span><span>' + p.total + ' Pkt</span></div>'; });
    html += '</div>';
    html += '<div class="btn-row" style="margin-top:4px">';

  function carcCityIdxForEdge(cityFeatures, edge) {

  // Generic corner algorithm: derives field regions (and which city features they touch) purely
  // from edge types + city group membership, without per-tile hand-authored field data.
  function carcComputeFieldFeatures(edges, cityFeatures) {
    var nodes = {}, adj = {};
    function addNode(id) { if (!nodes[id]) { nodes[id] = { touches: {} }; adj[id] = []; } }
    function addLink(a, b) { addNode(a); addNode(b); adj[a].push(b); adj[b].push(a); }

    CARC_DIRS.forEach(function(d) { if (edges[d] === 'F') addNode('E:' + d); });

    CARC_CORNERS.forEach(function(pair, ci) {
      var d1 = pair[0], d2 = pair[1];
      var c1 = edges[d1] === 'C' ? carcCityIdxForEdge(cityFeatures, d1) : -1;
      var c2 = edges[d2] === 'C' ? carcCityIdxForEdge(cityFeatures, d2) : -1;
      if (c1 !== -1 && c2 !== -1 && c1 === c2) return; // corner consumed by a connected city
      var id = 'K:' + ci;
      addNode(id);
      if (c1 !== -1) nodes[id].touches[c1] = true;
      if (c2 !== -1) nodes[id].touches[c2] = true;
      if (edges[d1] === 'F') addLink(id, 'E:' + d1);
      if (edges[d2] === 'F') addLink(id, 'E:' + d2);
    });

    var visited = {}, regions = [];
    Object.keys(nodes).forEach(function(start) {
      if (visited[start]) return;
      var stack = [start], comp = [], touches = {};
      while (stack.length) {
        var n = stack.pop();
        if (visited[n]) continue;
        visited[n] = true;
        comp.push(n);
        Object.keys(nodes[n].touches).forEach(function(t) { touches[t] = true; });
        (adj[n] || []).forEach(function(nb) { if (!visited[nb]) stack.push(nb); });
      }
      var compEdges = comp.filter(function(id) { return id.indexOf('E:') === 0; }).map(function(id) { return id.slice(2); });
      var compCorners = comp.filter(function(id) { return id.indexOf('K:') === 0; }).map(function(id) { return Number(id.slice(2)); });
      regions.push({ edges: compEdges, touches: Object.keys(touches).map(Number), corners: compCorners });
    });
    return regions;
  }

  var CARC_FIELD_SPOTS = [

  function carcHashStr(str) { var h = 7; for (var i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0; return h; }
  function carcDrawFieldTexture(typeKey) {
    var h = carcHashStr(typeKey || '');

      '<path d="M6,38 Q28,30 52,36 Q74,41 94,33" class="carc-field-contour"/>' +
      '<path d="M4,68 Q26,62 48,67 Q70,72 96,65" class="carc-field-contour"/>';

  }
  // Wiesen-Ankerpunkte so verschieben, dass Figuren frei auf der Wiese stehen (nicht auf Mauer, Straße oder Fluss).
  var carcAnchorCache = {};
  var carcHitCtx = null;
  function carcTileObstacles(typeKey) {
    var t = CARC_TILE_TYPES[typeKey];
    if (typeof Path2D === 'undefined') return null;
    if (!carcHitCtx) { try { carcHitCtx = document.createElement('canvas').getContext('2d'); } catch (e) { return null; } }
    if (!carcHitCtx) return null;
    var cityCount = t.features.filter(function(f){ return f.type==='city'; }).length;
    var areas = [], strokes = [];
    t.features.forEach(function(f) {
      if (f.type === 'city' && f.edges.length) areas.push(new Path2D(carcCityShape(f.edges, cityCount > 1).d));
      if (f.type === 'road' && f.edges.length) carcLinkPaths(f.edges).forEach(function(d){ strokes.push(new Path2D(d)); });
      if (f.type === 'monastery') areas.push(new Path2D('M28,10 H72 V70 H28 Z'));
    });
    var riverDirs = CARC_DIRS.filter(function(d){ return t.edges[d] === 'V'; });
    if (riverDirs.length) carcLinkPaths(riverDirs).forEach(function(d){ strokes.push(new Path2D(d)); });
    if (t.volcano) areas.push(new Path2D('M22,20 H78 V74 H22 Z'));
    return { areas: areas, strokes: strokes };
  }
  function carcAnchorFree(obs, x, y) {
    if (x < 10 || x > 90 || y < 10 || y > 90) return false;
    var ctx = carcHitCtx, R = 11.5;
    var probes = [[0,0],[R,0],[-R,0],[0,R],[0,-R],[R*0.7,R*0.7],[-R*0.7,R*0.7],[R*0.7,-R*0.7],[-R*0.7,-R*0.7]];
    for (var i=0;i<obs.areas.length;i++) {
      for (var j=0;j<probes.length;j++) if (ctx.isPointInPath(obs.areas[i], x+probes[j][0], y+probes[j][1])) return false;
    }
    ctx.lineWidth = 28;
    for (var k=0;k<obs.strokes.length;k++) if (ctx.isPointInStroke(obs.strokes[k], x, y)) return false;
    return true;
  }
  function carcTileAnchor(t, f) {
    var a = carcFeatureAnchor(f);
    if (f.type !== 'field') return a;
    var key = t.key + '|' + t.features.indexOf(f);
    if (carcAnchorCache[key]) return carcAnchorCache[key];
    var obs = carcTileObstacles(t.key);
    var res = a;
    if (obs && !carcAnchorFree(obs, a[0], a[1])) {
      var best = null, bestD = Infinity;
      for (var x=10; x<=90; x+=2) for (var y=10; y<=90; y+=2) {
        var d = (x-a[0])*(x-a[0]) + (y-a[1])*(y-a[1]);
        if (d < bestD && carcAnchorFree(obs, x, y)) { bestD = d; best = [x, y]; }
      }
      if (best) res = best;
    }
    carcAnchorCache[key] = res;
    return res;
  }
  function carcTileHTML(typeKey, rot, meepleInfo, ghostOptions, ghostColorHex, extra) {
    var t = CARC_TILE_TYPES[typeKey];

    var isolated = cityCount > 1;
    var roadFeatures = t.features.filter(function(f){ return f.type==='road'; });
    var soleDeadEnd = roadFeatures.length === 1 && roadFeatures[0].edges.length === 1;
    var svg = '<svg viewBox="0 0 100 100" class="carc-tile-svg"><g transform="rotate('+(rot*90)+' 50 50)">';

    svg += carcDrawFieldTexture(typeKey);
    var riverDirs = CARC_DIRS.filter(function(d){ return t.edges[d] === 'V'; });
    if (riverDirs.length) svg += carcDrawRiver(riverDirs);
    t.features.forEach(function(f){ if (f.type==='road') svg += carcDrawRoadFeature(f, soleDeadEnd); });
    var roadEnds = 0; roadFeatures.forEach(function(f){ roadEnds += f.edges.length; });
    if (roadFeatures.length >= 3 && roadEnds >= 3) svg += '<circle cx="50" cy="50" r="10" class="carc-road-hub"/>' + carcCityHouse(50, 51, 12, 0);
    t.features.forEach(function(f){ if (f.type==='city') svg += carcDrawCityFeature(f, isolated); });
    if (t.features.some(function(f){ return f.type==='monastery'; })) svg += carcDrawMonastery();
    if (t.volcano) svg += carcDrawVolcano();
    if (t.towerAt) svg += '<rect x="'+(t.towerAt[0]-7)+'" y="'+(t.towerAt[1]-7)+'" width="14" height="14" rx="2" class="carc-tower-found"/>';
    t.features.forEach(function(f) {
      if (f.type !== 'city') return;
      var a = carcFeatureAnchor(f);
      if (f.goods) svg += carcBadgeSVG(Math.min(88, a[0] + 14), a[1], CARC_GOODS[f.goods].icon, 7);
      if (f.princess) svg += carcBadgeSVG(Math.max(12, a[0] - 14), a[1], '👸', 7);
    });
    if (t.features.some(function(f){ return f.cathedral; })) svg += carcBadgeSVG(14, 14, '⛪');
    if (t.features.some(function(f){ return f.inn; })) svg += carcBadgeSVG(86, 14, '🍺');
    if (t.dragon) svg += carcBadgeSVG(14, 86, '🐉');

  // ---------- feature labels for the meeple-choice list ----------
  function carcFeatureLabel(tile, idx, fieldCounterRef) {
    var f = tile.features[idx];
    if (f.type === 'city') return '🏰 Stadt' + (f.shield ? ' 🛡️' : '') + (f.cathedral ? ' ⛪ (Kathedrale)' : '') + (f.goods ? ' ' + CARC_GOODS[f.goods].icon : '') + (f.princess ? ' 👸' : '');
    if (f.type === 'road') return '🛣️ Straße' + (f.inn ? ' 🍺 (Wirtshaus)' : '');
    if (f.type === 'monastery') return '⛪ Kloster';

    return '🌾 Wiese ' + String.fromCharCode(64 + fieldCounterRef.n);
  }

  function carcBuildDeck(expansions) {
    var tiles = [];
    CARC_RAW_TYPES.forEach(function(def) {
      var n = def.isStart ? def.count - 1 : def.count;
      for (var i=0;i<n;i++) tiles.push(def.key);
    });
    Object.keys(CARC_EXPANSION_RAW).forEach(function(expKey) {
      if (!expansions || !expansions[expKey]) return;
      CARC_EXPANSION_RAW[expKey].forEach(function(def) {
        for (var i=0;i<def.count;i++) tiles.push(def.key);
      });
    });
    return shuffleDeck(tiles);
  }

  // ---------- game state ----------
  var carcSetupNames = ['', ''];
  var carcSetupExpansions = {}; // vor jeder Runde neu wählbar
  var carcState = {
    phase: 'setup',
    players: [],
    order: [],
    turnPointer: 0,
    board: {},
    deck: [],
    deckTotal: 0,
    discardedCount: 0,
    currentTile: null,
    meepleChoice: null,
    completionMsgs: null,
    lastPlaced: null,
    matchRecorded: false,
    showHistory: false,
    expansions: {},
    riverQueue: [],
    pendingMsgs: [],
    showRules: false,
    bonusPending: false, bonusActive: false,
    fairy: null, dragon: null, dragonMove: null,
    towerMode: null, portalMode: null, fairyMode: null, captureChoice: null,
    turnCtx: null, turnNote: null
  };
  function carcRemainingCount() { return carcState.deck.length + carcState.riverQueue.length; }

  function carcComputeFrontier() {
    var board = carcState.board, seen = {}, out = [];
    Object.keys(board).forEach(function(bk) {
      var parts = bk.split(',').map(Number);
      CARC_DIRS.forEach(function(d) {
        var pos = carcNeighborPos(parts[0], parts[1], d), k = carcBoardKey(pos.r,pos.c);
        if (!board[k] && !seen[k]) { seen[k] = true; out.push(pos); }
      });
    });

  }
  function carcLegalCellsForRotation(typeKey, rot) {
    return carcComputeFrontier().filter(function(pos) { return carcIsLegalPlacement(carcState.board, pos.r, pos.c, typeKey, rot); });
  }
  function carcAnyLegalPlacement(typeKey) {
    for (var rot=0; rot<4; rot++) { if (carcLegalCellsForRotation(typeKey, rot).length) return true; }
    return false;
  }

  function startCarcassonne() {
    var names = carcSetupNames.map(function(n,i){ return n.trim() || ('Spieler ' + (i+1)); });
    if (names.length < 2) names = names.concat(['Spieler 2']);
    carcState.expansions = Object.assign({}, carcSetupExpansions);
    var exp = carcState.expansions;
    var towerCount = { 2:10, 3:9, 4:7, 5:6 }[names.length] || 6;
    carcState.players = names.map(function(n,i) {
      return {
        name:n, color:CARC_PLAYER_COLORS[i], score:0,
        meeplesLeft:7, bigMeeplesLeft:(exp.innsCathedrals ? 1 : 0),
        builderLeft:(exp.tradersBuilders ? 1 : 0), pigLeft:(exp.tradersBuilders ? 1 : 0),
        goods:{ wine:0, grain:0, cloth:0 },
        towerPieces:(exp.tower ? towerCount : 0), prisoners:[]
      };
    });

    carcState.turnPointer = 0;
    carcState.board = {};

      carcPlaceTileOnBoard(carcState.board, 0, 0, CARC_RIVER_START_TYPE, 0);
      carcState.riverQueue = CARC_RIVER_QUEUE.slice();
    } else {
      carcPlaceTileOnBoard(carcState.board, 0, 0, CARC_START_TYPE, 0);
      carcState.riverQueue = [];

    carcState.deck = carcBuildDeck(exp);
    carcState.deckTotal = carcState.deck.length + carcState.riverQueue.length;
    carcState.discardedCount = 0;
    carcState.currentTile = null;
    carcState.meepleChoice = null;
    carcState.completionMsgs = null;
    carcState.pendingMsgs = [];
    carcState.bonusPending = false;
    carcState.bonusActive = false;
    carcState.fairy = null;
    carcState.dragon = null;
    carcState.dragonMove = null;
    carcState.towerMode = null;
    carcState.portalMode = null;
    carcState.fairyMode = null;
    carcState.captureChoice = null;
    carcState.turnCtx = null;
    carcState.turnNote = null;
    carcState.matchRecorded = false;

  function carcDrawForTurn() {
    while (true) {
      if (carcState.riverQueue.length) {
        var riverType = carcState.riverQueue[0];
        if (carcAnyLegalPlacement(riverType)) { carcState.riverQueue.shift(); carcState.currentTile = { typeKey:riverType, rot:0 }; return; }
        carcState.riverQueue.shift();
        carcState.discardedCount++;
        continue;
      }
      if (carcState.deck.length === 0) { carcFinishGame(); return; }
      var typeKey = carcState.deck.pop();
      if (carcAnyLegalPlacement(typeKey)) { carcState.currentTile = { typeKey:typeKey, rot:0 }; return; }

  }

  function carcPlaceCurrentTile(r, c) {
    var typeKey = carcState.currentTile.typeKey, rot = carcState.currentTile.rot;

    carcPlaceTileOnBoard(board, r, c, typeKey, rot);
    carcState.lastPlaced = { r:r, c:c };
    carcState.currentTile = null;
    carcState.turnNote = null;
    carcState.turnCtx = { r:r, c:c };
    var tile = board[carcBoardKey(r,c)], type = CARC_TILE_TYPES[typeKey];
    var pIdx = carcState.order[carcState.turnPointer], player = carcState.players[pIdx];

    // Baumeister: Wer ein Gebiet mit dem eigenen Baumeister verlängert, legt gleich noch ein Plättchen.
    if (exp.tradersBuilders && !carcState.bonusActive) {
      tile.features.forEach(function(f, idx) {
        if (f.type !== 'city' && f.type !== 'road') return;
        var ff = carcFloodFill(board, r, c, idx);

      });

    var canFollower = player.meeplesLeft > 0 || player.bigMeeplesLeft > 0;
    tile.features.forEach(function(f, idx) {

      if (type.volcano) return; // auf dem Vulkan darf keine Figur stehen
      var ff = null;
      if (f.type === 'field') ff = carcFloodFillField(board, r, c, idx);

      if (exp.tradersBuilders && ownFollower) {
        if ((f.type === 'city' || f.type === 'road') && player.builderLeft > 0) specials.push({ type:'builder', idx:idx, label:'🔨 Baumeister → ' + label });

          specials.push({ type:'princess', r:m.r, c:m.c, label:'👸 ' + carcFigureName(m) + ' von ' + carcState.players[m.player].name + ' vertreiben' });
        });
      });
      if (type.portal && canFollower) specials.push({ type:'portal', label:'🌀 Portal: Meeple auf ein beliebiges Plättchen' });
      if (carcPlayerHasFollowerOnBoard(pIdx)) specials.push({ type:'fairy', label:'🧚 Fee zu einem deiner Meeples stellen' });
    }

    if (options.length || specials.length) carcState.meepleChoice = { r:r, c:c, options:options, specials:specials, useBig:false };
    else { carcState.meepleChoice = null; carcAfterFigurePhase(); }
  }

  function carcResolveCompletions(r, c) {
    var messages = carcState.pendingMsgs || [];
    carcState.pendingMsgs = [];
    var board = carcState.board, tile = board[carcBoardKey(r,c)];
    var pIdx = carcState.order[carcState.turnPointer];
    var seen = {};
    tile.features.forEach(function(f, idx) {
      if (f.type !== 'city' && f.type !== 'road') return;
      var ff = carcFloodFill(board, r, c, idx);
      if (!ff.complete) return;
      var sig = ff.members.map(function(m){ return m.r+'_'+m.c+'_'+m.idx; }).sort().join('|');
      if (seen[sig]) return;
      seen[sig] = true;
      // Händler: Waren bekommt, wer die Stadt schließt – auch ohne eigenen Ritter.
      if (f.type === 'city' && carcState.expansions.tradersBuilders) {
        var gl = [];
        Object.keys(ff.goods).forEach(function(g) {
          if (!ff.goods[g]) return;
          carcState.players[pIdx].goods[g] += ff.goods[g];
          gl.push(ff.goods[g] + '× ' + CARC_GOODS[g].icon + ' ' + CARC_GOODS[g].name);
        });
        if (gl.length) messages.push({ icon:'📦', label:'Waren: ' + gl.join(', '), winners:[carcState.players[pIdx].name], points:0 });
      }
      if (carcFollowers(ff.meeples).length) {
        var pts = carcScoreCityOrRoad(ff);
        var winners = carcMajorityWinners(ff.meeples);
        winners.forEach(function(p){ carcState.players[p].score += pts; });
        messages.push({
          icon: f.type==='city' ? '🏰' : '🛣️',
          label: (f.type==='city' ? 'Stadt' : 'Straße') + ' abgeschlossen (' + ff.members.length + ' Teile' + (ff.shields ? ', ' + ff.shields + '× Wappen' : '') + ')',
          winners: winners.map(function(p){ return carcState.players[p].name; }),
          points: pts
        });
        carcFairyBonus(ff.meeples, messages);
      }
      carcReturnMeeples(ff.meeples);
    });
    var toCheck = [{ r:r, c:c }];
    for (var dr=-1; dr<=1; dr++) for (var dc=-1; dc<=1; dc++) { if (dr||dc) toCheck.push({ r:r+dr, c:c+dc }); }
    toCheck.forEach(function(pos) {
      var t2 = board[carcBoardKey(pos.r,pos.c)];
      if (!t2 || !t2.meeple) return;
      var mIdx = -1;
      t2.features.forEach(function(f,idx){ if (f.type==='monastery') mIdx = idx; });
      if (mIdx === -1 || t2.meeple.idx !== mIdx) return;
      if (!carcMonasteryComplete(board, pos.r, pos.c)) return;
      var m = t2.meeple, list = [{ r:pos.r, c:pos.c, player:m.player, big:m.big, kind:m.kind || 'follower' }];
      carcState.players[m.player].score += 9;
      messages.push({ icon:'⛪', label:'Kloster abgeschlossen', winners:[carcState.players[m.player].name], points:9 });
      carcFairyBonus(list, messages);
      carcReturnMeeples(list);
    });

    if (!carcState.completionMsgs) carcAdvanceTurn();
  }

  function carcPlaceMeepleAndResolve(idx, useBig) {
    var mc = carcState.meepleChoice;
    var tile = carcState.board[carcBoardKey(mc.r, mc.c)];
    var pIdx = carcState.order[carcState.turnPointer];
    var player = carcState.players[pIdx];
    var big = !!useBig && player.bigMeeplesLeft > 0;
    if (!big && player.meeplesLeft <= 0) big = player.bigMeeplesLeft > 0; // nur noch großer Meeple übrig
    tile.meeple = { idx:idx, player:pIdx, big:big, kind:'follower' };
    if (big) player.bigMeeplesLeft--; else player.meeplesLeft--;
    carcState.meepleChoice = null;
    carcAfterFigurePhase();
  }

  function carcAdvanceTurn() {
    carcState.meepleChoice = null;
    carcState.completionMsgs = null;
    carcState.turnNote = null;
    if (carcState.bonusPending) {
      carcState.bonusPending = false;
      carcState.bonusActive = true;
      carcState.turnNote = '🔨 Baumeister-Bonus: Du legst gleich noch ein Plättchen!';
    } else {
      carcState.bonusActive = false;
      carcState.turnPointer = (carcState.turnPointer + 1) % carcState.order.length;
      var fy = carcState.fairy, pIdx = carcState.order[carcState.turnPointer];
      if (fy) {
        var ft = carcState.board[carcBoardKey(fy.r, fy.c)];
        if (ft && ft.meeple && carcIsFollower(ft.meeple) && ft.meeple.player === pIdx) {
          carcState.players[pIdx].score += 1;
          carcState.turnNote = '🧚 Die Fee steht bei deinem Meeple: +1 Punkt.';
        }
      }
    }
    carcDrawForTurn();
  }

  function carcFinishGame() {
    var processed = {}, board = carcState.board, exp = carcState.expansions;
    Object.keys(board).forEach(function(bk) {
      var tile = board[bk], parts = bk.split(',').map(Number);
      tile.features.forEach(function(f, idx) {
        if (f.type !== 'city' && f.type !== 'road') return;
        var ff = carcFloodFill(board, parts[0], parts[1], idx);
        var vk = ff.members.map(function(m){ return m.r+'_'+m.c+'_'+m.idx; }).sort().join('|');
        if (processed[vk]) return;
        processed[vk] = true;
        if (ff.complete || ff.meeples.length === 0) return;
        // Kathedrale/Wirtshaus: unvollendet zählt alles-oder-nichts, also 0 Punkte statt Trostpunkte.
        var zeroed = (f.type==='city' && ff.hasCathedral) || (f.type==='road' && ff.hasInn);
        if (carcFollowers(ff.meeples).length && !zeroed) {
          var pts = f.type==='city' ? (ff.members.length + ff.shields) : ff.members.length;
          carcMajorityWinners(ff.meeples).forEach(function(p){ carcState.players[p].score += pts; });
          carcFairyBonus(ff.meeples, null);
        }
        carcReturnMeeples(ff.meeples);
      });
      tile.features.forEach(function(f, idx) {
        if (f.type !== 'monastery') return;
        if (!tile.meeple || tile.meeple.idx !== idx) return;
        if (carcMonasteryComplete(board, parts[0], parts[1])) return;
        var m = tile.meeple, count = 1;
        for (var dr=-1; dr<=1; dr++) for (var dc=-1; dc<=1; dc++) { if (!dr && !dc) continue; if (board[carcBoardKey(parts[0]+dr, parts[1]+dc)]) count++; }
        var list = [{ r:parts[0], c:parts[1], player:m.player, big:m.big, kind:m.kind || 'follower' }];
        carcState.players[m.player].score += count;
        carcFairyBonus(list, null);
        carcReturnMeeples(list);
      });
    });
    var fieldResult = carcScoreAllFields(board);
    Object.keys(fieldResult.pointsByPlayer).forEach(function(p) {
      carcState.players[Number(p)].score += fieldResult.pointsByPlayer[p];
    });
    fieldResult.regions.forEach(function(region) {
      if (carcFollowers(region.meeples).length && region.completedCities.length) carcFairyBonus(region.meeples, null);
    });
    // Händler: Wer von einer Ware am meisten hat, bekommt 10 Punkte (bei Gleichstand alle).
    if (exp.tradersBuilders) {
      Object.keys(CARC_GOODS).forEach(function(g) {
        var max = Math.max.apply(null, carcState.players.map(function(p){ return p.goods[g]; }));
        if (max <= 0) return;
        carcState.players.forEach(function(p){ if (p.goods[g] === max) p.score += 10; });
      });
    }
    carcState.phase = 'finished';
    carcRecordMatch();
  }

  function carcIsFollower(m) { return !m.kind || m.kind === 'follower'; }
  function carcFollowers(list) { return list.filter(carcIsFollower); }
  function carcPoolReturn(pIdx, big) {
    if (big) carcState.players[pIdx].bigMeeplesLeft++; else carcState.players[pIdx].meeplesLeft++;
  }
  function carcFigureName(m) {
    if (m.kind === 'builder') return 'Baumeister';
    if (m.kind === 'pig') return 'Schwein';
    return m.big ? 'großen Meeple' : 'Meeple';
  }
  // Fee: Wird ein Gebiet gewertet, in dem der Meeple unter der Fee steht, bekommt dessen Besitzer 3 Punkte.
  function carcFairyBonus(meeples, messages) {
    var fy = carcState.fairy;
    if (!fy) return;
    carcFollowers(meeples).forEach(function(m) {
      if (m.r !== fy.r || m.c !== fy.c) return;
      carcState.players[m.player].score += 3;
      if (messages) messages.push({ icon:'🧚', label:'Fee-Bonus', winners:[carcState.players[m.player].name], points:3 });
    });
  }

  function carcRotatePoint(pt, rot) {
    var x = pt[0], y = pt[1];
    for (var i = 0; i < rot; i++) { var nx = 100 - y, ny = x; x = nx; y = ny; }
    return [x, y];

  function carcFigureSVGAt(x, y, hex, big, kind) {
    if (kind === 'builder' || kind === 'pig') {
