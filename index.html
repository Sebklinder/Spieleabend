  function carcPlayerHasFollowerOnBoard(pIdx) {
    var board = carcState.board;
    return Object.keys(board).some(function(k) {
      var m = board[k].meeple;
      return m && carcIsFollower(m) && m.player === pIdx;
    });
  }
  function carcAnyTowerSpot() {
    var board = carcState.board;
    return Object.keys(board).some(function(k){ return !!CARC_TILE_TYPES[board[k].typeKey].towerAt; });
  }
  function carcIsDragonAt(r, c) { return !!(carcState.dragon && carcState.dragon.r === r && carcState.dragon.c === c); }
  function carcIsFairyAt(r, c) { return !!(carcState.fairy && carcState.fairy.r === r && carcState.fairy.c === c); }


  // Nach der Figurenphase: ggf. Drache bewegen, danach Wertung.
  function carcAfterFigurePhase() {
    var ctx = carcState.turnCtx;
    var type = CARC_TILE_TYPES[carcState.board[carcBoardKey(ctx.r, ctx.c)].typeKey];
    if (carcState.expansions.princessDragon && type.dragon && carcState.dragon) {
      var visited = {};
      visited[carcBoardKey(carcState.dragon.r, carcState.dragon.c)] = true;
      carcState.dragonMove = { stepsLeft:6, step:0, visited:visited, eaten:[] };
      if (carcDragonTargets().length) return;
      carcState.dragonMove = null;
    }
    carcResolveCompletions(ctx.r, ctx.c);
  }
  function carcDragonTargets() {
    var d = carcState.dragon, dm = carcState.dragonMove, out = [];
    CARC_DIRS.forEach(function(dir) {
      var pos = carcNeighborPos(d.r, d.c, dir), k = carcBoardKey(pos.r, pos.c);
      if (!carcState.board[k] || dm.visited[k]) return;
      if (carcIsFairyAt(pos.r, pos.c)) return; // die Fee schützt ihr Plättchen
      out.push(pos);
    });
    return out;
  }
  function carcDragonStep(r, c) {
    var dm = carcState.dragonMove, k = carcBoardKey(r, c), tile = carcState.board[k];
    carcState.dragon = { r:r, c:c };
    dm.visited[k] = true;
    if (tile.meeple) {
      var m = tile.meeple;
      dm.eaten.push(carcFigureName(m) + ' von ' + carcState.players[m.player].name);
      carcState.pendingMsgs.push({ icon:'🐉', label:'Drache frisst ' + carcFigureName(m) + ' von ' + carcState.players[m.player].name, winners:[], points:0 });
      carcReturnMeeples([{ r:r, c:c, player:m.player, big:m.big, kind:m.kind || 'follower' }]);
    }
    dm.stepsLeft--;
    dm.step++;
    if (dm.stepsLeft <= 0 || !carcDragonTargets().length) {
      carcState.dragonMove = null;
      carcResolveCompletions(carcState.turnCtx.r, carcState.turnCtx.c);
    }
  }



  function carcDoSpecial(i) {
    var mc = carcState.meepleChoice, s = mc.specials[i];
    var pIdx = carcState.order[carcState.turnPointer], player = carcState.players[pIdx];
    if (s.type === 'builder' || s.type === 'pig') {
      carcState.board[carcBoardKey(mc.r, mc.c)].meeple = { idx:s.idx, player:pIdx, kind:s.type };
      if (s.type === 'builder') player.builderLeft--; else player.pigLeft--;
      carcState.meepleChoice = null;
      carcAfterFigurePhase();
      return;
    }
    if (s.type === 'princess') {
      var m = carcState.board[carcBoardKey(s.r, s.c)].meeple;
      carcState.pendingMsgs.push({ icon:'👸', label:'Prinzessin vertreibt ' + carcFigureName(m) + ' von ' + carcState.players[m.player].name, winners:[], points:0 });
      carcReturnMeeples([{ r:s.r, c:s.c, player:m.player, big:m.big, kind:m.kind || 'follower' }]);
      carcState.meepleChoice = null;
      carcAfterFigurePhase();
      return;
    }
    carcState.meepleChoice = null;
    if (s.type === 'tower') carcState.towerMode = { back:mc };
    else if (s.type === 'portal') carcState.portalMode = { back:mc };
    else if (s.type === 'fairy') carcState.fairyMode = { back:mc };
  }

  function carcPortalOptions(r, c) {
    var board = carcState.board, tile = board[carcBoardKey(r,c)];
    if (!tile || tile.meeple || carcIsDragonAt(r, c)) return [];
    var out = [], fc = { n:0 };
    tile.features.forEach(function(f, idx) {
      var label = carcFeatureLabel(tile, idx, fc);
      if (f.type === 'monastery') { if (!carcMonasteryComplete(board, r, c)) out.push({ idx:idx, label:label }); return; }
      if (f.type === 'field') { if (!carcFollowers(carcFloodFillField(board, r, c, idx).meeples).length) out.push({ idx:idx, label:label }); return; }
      var ff = carcFloodFill(board, r, c, idx);
      if (!ff.complete && !carcFollowers(ff.meeples).length) out.push({ idx:idx, label:label });
    });
    return out;
  }
  function carcPickableSet() {
    var set = {}, board = carcState.board, pIdx = carcState.order[carcState.turnPointer];
    if (carcState.dragonMove) {
      carcDragonTargets().forEach(function(p){ set[carcBoardKey(p.r,p.c)] = true; });
      return set;
    }
    if (!carcState.towerMode && !carcState.portalMode && !carcState.fairyMode) return set;
    Object.keys(board).forEach(function(k) {
      var tile = board[k], parts = k.split(',').map(Number);
      if (carcState.towerMode) { if (CARC_TILE_TYPES[tile.typeKey].towerAt) set[k] = true; }
      else if (carcState.fairyMode) { if (tile.meeple && carcIsFollower(tile.meeple) && tile.meeple.player === pIdx) set[k] = true; }
      else if (carcState.portalMode) { if (carcPortalOptions(parts[0], parts[1]).length) set[k] = true; }
    });
    return set;
  }
  function carcPickCell(r, c) {
    var pIdx = carcState.order[carcState.turnPointer], player = carcState.players[pIdx];
    if (carcState.dragonMove) { carcDragonStep(r, c); return; }
    if (carcState.towerMode) {
      carcState.towerMode = null;
      var tile = carcState.board[carcBoardKey(r,c)];
      tile.towerHeight = (tile.towerHeight || 0) + 1;
      player.towerPieces--;
      var h = tile.towerHeight, cells = [{ r:r, c:c }], opts = [];
      CARC_DIRS.forEach(function(d) {
        for (var k = 1; k <= h; k++) cells.push({ r:r + CARC_NEIGH[d][0]*k, c:c + CARC_NEIGH[d][1]*k });
      });
      cells.forEach(function(pos) {
        var t2 = carcState.board[carcBoardKey(pos.r,pos.c)];
        if (!t2 || !t2.meeple || !carcIsFollower(t2.meeple)) return;
        var m = t2.meeple;
        opts.push({ r:pos.r, c:pos.c, label:'⛓️ ' + carcFigureName(m) + ' von ' + carcState.players[m.player].name + (pos.r === r && pos.c === c ? ' (auf dem Turm)' : '') });
      });
      if (opts.length) carcState.captureChoice = { options:opts, height:h };
      else carcAfterFigurePhase();
      return;
    }
    if (carcState.fairyMode) {
      carcState.fairyMode = null;
      carcState.fairy = { r:r, c:c };
      carcAfterFigurePhase();
      return;
    }
    if (carcState.portalMode) {
      var back = carcState.portalMode.back;
      carcState.portalMode = null;
      carcState.meepleChoice = { r:r, c:c, options:carcPortalOptions(r, c), specials:[], useBig:false, back:back };
    }
  }
  function carcCapture(i) {
    var opt = carcState.captureChoice.options[i];
    carcState.captureChoice = null;
    var captorIdx = carcState.order[carcState.turnPointer], captor = carcState.players[captorIdx];
    var tile = carcState.board[carcBoardKey(opt.r, opt.c)], m = tile.meeple;
    tile.meeple = null;
    var owner = carcState.players[m.player], label;
    if (m.player === captorIdx) {
      carcPoolReturn(captorIdx, m.big);
      label = captor.name + ' nimmt den eigenen Meeple zurück';
    } else {
      var swap = -1;
      owner.prisoners.forEach(function(pr, j){ if (swap === -1 && pr.owner === captorIdx) swap = j; });
      if (swap !== -1) {
        var freed = owner.prisoners.splice(swap, 1)[0];
        carcPoolReturn(captorIdx, freed.big);
        carcPoolReturn(m.player, m.big);
        label = 'Gefangenenaustausch zwischen ' + captor.name + ' und ' + owner.name;
      } else {
        captor.prisoners.push({ owner:m.player, big:!!m.big });
        label = captor.name + ' nimmt ' + carcFigureName(m) + ' von ' + owner.name + ' gefangen';
      }
    }
    carcState.pendingMsgs.push({ icon:'🗼', label:label, winners:[], points:0 });
    carcAfterFigurePhase();
  }
  function carcRansom(captorIdx) {
    var pIdx = carcState.order[carcState.turnPointer], me = carcState.players[pIdx], captor = carcState.players[captorIdx];
    if (me.score < 3) return;
    for (var i = 0; i < captor.prisoners.length; i++) {
      if (captor.prisoners[i].owner !== pIdx) continue;
      var pr = captor.prisoners.splice(i, 1)[0];
      me.score -= 3;
      captor.score += 3;
      carcPoolReturn(pIdx, pr.big);
      return;
    }
  }

  // ---------- history persistence ----------
  function loadCarcHistory() { try { var raw = localStorage.getItem(CARC_HISTORY_KEY); return raw ? JSON.parse(raw) : []; } catch(e) { return []; } }
  function saveCarcHistory(list) { try { localStorage.setItem(CARC_HISTORY_KEY, JSON.stringify(list)); } catch(e) {} }
  function carcRecordMatch() {
    if (carcState.matchRecorded) return;
    carcState.matchRecorded = true;
    var results = carcState.players.map(function(p){ return { name:p.name, score:p.score }; });
    var maxScore = Math.max.apply(null, results.map(function(r){ return r.score; }));
    var winners = results.filter(function(r){ return r.score === maxScore; }).map(function(r){ return r.name; });
    var match = { id:'carc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), date:new Date().toISOString(), players:results, winners:winners };
    var history = loadCarcHistory();
    history.unshift(match);
    if (history.length > 200) history = history.slice(0,200);
    saveCarcHistory(history);
  }
  function computeCarcStats(history) {
    var stats = {};
    history.forEach(function(m) {
      m.players.forEach(function(p) {
        if (!stats[p.name]) stats[p.name] = { name:p.name, games:0, wins:0, totalScore:0 };
        stats[p.name].games++; stats[p.name].totalScore += p.score;
        if (m.winners.indexOf(p.name) !== -1) stats[p.name].wins++;
      });
    });
    return Object.keys(stats).map(function(k){ return stats[k]; }).sort(function(a,b){ return b.wins-a.wins || b.totalScore-a.totalScore; });
  }
  function matchLineCarc(m) {
    var sorted = m.players.slice().sort(function(a,b){ return b.score-a.score; });
    return sorted.map(function(p) {
      var won = m.winners.indexOf(p.name) !== -1;
      return (won ? '👑 ' : '') + escapeHtml(p.name) + ' ' + p.score;
    }).join(' · ');
  }

  function carcBoardHTML() {
    var board = carcState.board, keys = Object.keys(board);
    var minR=0, maxR=0, minC=0, maxC=0;
    keys.forEach(function(k) {
      var p = k.split(',').map(Number);
      if (p[0] < minR) minR = p[0]; if (p[0] > maxR) maxR = p[0];
      if (p[1] < minC) minC = p[1]; if (p[1] > maxC) maxC = p[1];
    });
    minR--; maxR++; minC--; maxC++;
    var legalSet = {};
    if (carcState.currentTile) {
      carcLegalCellsForRotation(carcState.currentTile.typeKey, carcState.currentTile.rot).forEach(function(pos) {
        legalSet[carcBoardKey(pos.r,pos.c)] = true;
      });
    }
    var pickSet = carcPickableSet();
    var cols = maxC-minC+1, rows = maxR-minR+1;
    var html = '<div class="carc-board-scroll"><div class="carc-board-grid" style="grid-template-columns:repeat(' + cols + ',68px);grid-template-rows:repeat(' + rows + ',68px)">';
    for (var r=minR; r<=maxR; r++) {
      for (var c=minC; c<=maxC; c++) {
        var k = carcBoardKey(r,c), tile = board[k];
        if (tile) {
          var meepleInfo = null;
          if (tile.meeple) meepleInfo = { featureIdx: tile.meeple.idx, colorHex: carcState.players[tile.meeple.player].color.hex, big: tile.meeple.big, kind: tile.meeple.kind };
          var isLast = carcState.lastPlaced && carcState.lastPlaced.r===r && carcState.lastPlaced.c===c;
          var extra = { towerHeight: tile.towerHeight || 0, dragon: carcIsDragonAt(r, c), fairy: carcIsFairyAt(r, c) };
          var pick = !!pickSet[k];
          html += '<div class="carc-cell filled' + (isLast ? ' last' : '') + (pick ? ' pickable' : '') + '"' + (pick ? ' data-r="' + r + '" data-c="' + c + '"' : '') + '>' +
            carcTileHTML(tile.typeKey, tile.rot, meepleInfo, null, null, extra) + '</div>';
        } else if (legalSet[k]) {
          html += '<div class="carc-cell legal" data-r="' + r + '" data-c="' + c + '"></div>';
        } else {
          html += '<div class="carc-cell"></div>';
        }
      }
    }
    html += '</div></div>';
    return html;
  }

  // ===================================================================
  // ---------- Gemeinsame Helfer für Lost Cities, 6 nimmt!, Backgammon, Codenames Duet, Qwixx ----------
  // ===================================================================
  // Registry: key = localStorage-Schlüssel, lower = weniger Punkte gewinnen, state() = Spielzustand, render() = Bildschirm
  var SG = {};
  function sgLoad(key) { try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; } catch(e) { return []; } }
  function sgSave(key, list) { try { localStorage.setItem(key, JSON.stringify(list)); } catch(e) {} }
  // players: [{name, score}] · extra: z. B. {note:'Gammon'}
  function sgRecord(gameId, players, extra) {
    var g = SG[gameId];
    var scores = players.map(function(p) { return p.score; });
    var best = g.lower ? Math.min.apply(null, scores) : Math.max.apply(null, scores);
    var m = {
      id: gameId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      date: new Date().toISOString(),
      players: players,
      winners: (extra && extra.winners) || players.filter(function(p) { return p.score === best; }).map(function(p) { return p.name; })
    };
    if (extra && extra.note) m.note = extra.note;
    var list = sgLoad(g.key);
    list.unshift(m);
    if (list.length > 200) list = list.slice(0, 200);
    sgSave(g.key, list);
    return m;
  }
  function sgMatchLine(gameId, m) {
    var g = SG[gameId];
    if (g.coop) return (m.winners.length ? '🎉 Gewonnen' : '💀 Verloren') + ' · ' + m.players.map(function(p) { return escapeHtml(p.name); }).join(' & ') + (m.note ? ' · ' + escapeHtml(m.note) : '');
    var sorted = m.players.slice().sort(function(a, b) { return g.lower ? a.score - b.score : b.score - a.score; });
    return sorted.map(function(p) {
      return (m.winners.indexOf(p.name) !== -1 ? '👑 ' : '') + escapeHtml(p.name) + ' ' + p.score;
    }).join(' · ') + (m.note ? ' · ' + escapeHtml(m.note) : '');
  }
  function sgRenderHistoryOverlay(gameId) {
    var g = SG[gameId], st = g.state();

    if (!history.length) {
      html += '<p class="empty-hint">Noch keine beendete Partie ' + g.icon + '<br>Spiel eine Runde zu Ende, dann siehst du hier eure Bilanz.</p>';
    } else {
      var stats = {};
      history.forEach(function(m) {
        m.players.forEach(function(p) {
          if (!stats[p.name]) stats[p.name] = { name: p.name, games: 0, wins: 0 };
          stats[p.name].games++;
          if (m.winners.indexOf(p.name) !== -1) stats[p.name].wins++;
        });
      });
      var list = Object.keys(stats).map(function(k) { return stats[k]; }).sort(function(a, b) { return b.wins - a.wins || b.games - a.games; });
      html += '<h3 class="section-title">🏅 ' + (g.coop ? 'Erfolge' : 'Bestenliste') + '</h3><div class="stats-list">';
      list.forEach(function(s, i) {

          '<span class="stat-detail">' + s.wins + (g.coop ? ' gewonnen' : ' Siege') + ' · ' + s.games + ' Spiele</span></div>';
      });
      html += '</div>' + sgH2HHtml(sgNormalized(gameId));
      html += '<h3 class="section-title">🕒 Letzte Partien</h3><div class="stats-list">';
      history.slice(0, 12).forEach(function(m) {
        html += '<div class="match-row"><span class="match-date">' + formatDate(m.date) + '</span><span class="match-line">' + sgMatchLine(gameId, m) + '</span></div>';

    }
    html += '</div></div>';
    main.insertAdjacentHTML('beforeend', html);
    document.getElementById('sgCloseHistory').addEventListener('click', function() { st.showHistory = false; render(); });
    var clr = document.getElementById('sgClearHistory');
    if (clr) clr.addEventListener('click', function() {
      if (confirm('Verlauf wirklich löschen? Das kann nicht rückgängig gemacht werden.')) { sgSave(g.key, []); render(); }
    });
  }
  // Namenseingabe: names = Array (wird verändert), prefix = eindeutiges Präfix für IDs/Klassen
  function sgNamesHtml(names, prefix, min, max, placeholders) {
    var html = '<h2 class="section-title" style="margin-top:0">🙋 Wer spielt mit?</h2>';

  function sgBindNames(names, prefix, max) {

  }

    return names.map(function(n, i) { return n.trim() || (placeholders && placeholders[i] ? placeholders[i] : 'Spieler ' + (i+1)); });

  function sgPassHtml(name, btnId, btnLabel, extra, icon) {

  }
  function sgNewGameBtnHtml(id) { return '<div class="footer-actions"><button class="btn btn-ghost" id="' + id + '">Neues Spiel</button></div>'; }
  function sgBindNewGame(id, st) {

  function sgRollDie() { return 1 + Math.floor(Math.random() * 6); }

  // ===================================================================
  // ---------- Spielübergreifende Statistik: Direktvergleiche & Gesamtrangliste ----------
  // ===================================================================
  // Einheitliches Format: {game, date, names:[...], winners:[...], coop}
  function sgNormalized(gameId) {
    var out = [];
    function add(game, list, fn) { list.forEach(function(m) { var n = fn(m); if (n && n.names.length) { n.game = game; n.date = m.date; out.push(n); } }); }
    // rank: Name → Wert, höher = besser platziert (für den paarweisen Vergleich in Mehrspieler-Partien)
    function rankMap(players, field, lower) { var r = {}; players.forEach(function(p) { if (typeof p[field] === 'number') r[p.name] = lower ? -p[field] : p[field]; }); return r; }
    if (!gameId || gameId === 'kniffel') add('kniffel', loadHistory(), function(m) { return { names: m.players.map(function(p) { return p.name; }), winners: m.winners || [], rank: rankMap(m.players, 'total') }; });
    if (!gameId || gameId === 'knack') add('knack', loadKnackHistory(), function(m) {
      var r = {}; m.players.forEach(function(p) { r[p.name] = p.out ? (p.outRound || 0) : 9999; });
      return { names: m.players.map(function(p) { return p.name; }), winners: m.winner ? [m.winner] : [], rank: r };
    });
    if (!gameId || gameId === 'schach') add('schach', loadSchachHistory(), function(m) {
      return { names: [m.white, m.black], winners: m.result === 'white' ? [m.white] : (m.result === 'black' ? [m.black] : []) };
    });
    if (!gameId || gameId === 'cabo') add('cabo', loadCaboHistory(), function(m) { return { names: m.players.map(function(p) { return p.name; }), winners: m.winners || [], rank: rankMap(m.players, 'total', true) }; });
    if (!gameId || gameId === 'carcassonne') add('carcassonne', loadCarcHistory(), function(m) { return { names: m.players.map(function(p) { return p.name; }), winners: m.winners || [], rank: rankMap(m.players, 'score') }; });
    Object.keys(SG).forEach(function(id) {
      if (gameId && gameId !== id) return;
      add(id, sgLoad(SG[id].key), function(m) { return { names: m.players.map(function(p) { return p.name; }), winners: m.winners || [], coop: !!SG[id].coop, rank: rankMap(m.players, 'score', SG[id].lower) }; });
    });
    return out;
  }
  // Paarweise Bilanz: wer die Partie gewinnt, schlägt alle anderen; sonst entscheidet die bessere Platzierung/Punktzahl
  function sgHeadToHead(matches) {
    var pairs = {};
    matches.forEach(function(m) {
      if (m.coop) return;
      var names = m.names.filter(function(n, i, a) { return a.indexOf(n) === i; });
      for (var i = 0; i < names.length; i++) for (var j = i + 1; j < names.length; j++) {
        var ab = [names[i], names[j]].sort(), a = ab[0], b = ab[1], k = a + '\u0000' + b;
        if (!pairs[k]) pairs[k] = { a: a, b: b, winsA: 0, winsB: 0, ties: 0, games: 0 };
        var p = pairs[k], aw = m.winners.indexOf(a) !== -1, bw = m.winners.indexOf(b) !== -1;
        p.games++;
        if (aw && !bw) p.winsA++;
        else if (bw && !aw) p.winsB++;
        else if (m.rank && typeof m.rank[a] === 'number' && typeof m.rank[b] === 'number' && m.rank[a] !== m.rank[b]) { if (m.rank[a] > m.rank[b]) p.winsA++; else p.winsB++; }
        else p.ties++;
      }
    });
    return Object.keys(pairs).map(function(k) { return pairs[k]; }).sort(function(x, y) { return y.games - x.games; });
  }
  function sgH2HHtml(matches, title) {
    var list = sgHeadToHead(matches);
    if (!list.length) return '';
    var html = '<h3 class="section-title">⚔️ ' + (title || 'Wer gegen wen') + '</h3><div class="stats-list">';
    list.forEach(function(p) {
      var lead = p.winsA === p.winsB ? '' : (p.winsA > p.winsB ? 'a' : 'b');
      html += '<div class="h2h-row"><span class="pname' + (lead === 'a' ? ' lead' : '') + '">' + (lead === 'a' ? '👑 ' : '') + escapeHtml(p.a) + '</span>' +
        '<span class="h2h-score">' + p.winsA + ' : ' + p.winsB + '</span>' +
        '<span class="pname' + (lead === 'b' ? ' lead' : '') + '" style="text-align:right">' + escapeHtml(p.b) + (lead === 'b' ? ' 👑' : '') + '</span></div>' +
        '<div class="h2h-sub">' + p.games + ' gemeinsame Partie' + (p.games === 1 ? '' : 'n') + (p.ties ? ' · ' + p.ties + '× unentschieden' : '') + '</div>';
    });
    return html + '</div>';
  }
  // Gesamtrangliste über alle Spiele
  function sgOverallRanking(matches) {
    var st = {};
    function get(n) { if (!st[n]) st[n] = { name: n, games: 0, wins: 0, coopGames: 0, coopWins: 0, perGame: {} }; return st[n]; }
    matches.forEach(function(m) {
      m.names.forEach(function(n) {
        var s = get(n), won = m.winners.indexOf(n) !== -1;
        if (m.coop) { s.coopGames++; if (won) s.coopWins++; return; }
        s.games++;
        if (won) s.wins++;
        if (!s.perGame[m.game]) s.perGame[m.game] = { g: 0, w: 0 };
        s.perGame[m.game].g++;
        if (won) s.perGame[m.game].w++;
      });
    });
    return Object.keys(st).map(function(k) { return st[k]; })
      .filter(function(s) { return s.games || s.coopGames; })
      .sort(function(a, b) { return b.wins - a.wins || (b.wins / Math.max(1, b.games)) - (a.wins / Math.max(1, a.games)) || b.games - a.games; });
  }
  function sgRankingHtml(matches) {
    var list = sgOverallRanking(matches);
    if (!list.length) return '';
    var medals = ['🥇', '🥈', '🥉'];
    var html = '<h3 class="section-title">🏆 Gesamtrangliste (alle Spiele)</h3><div class="stats-list">';
    list.forEach(function(s, i) {
      var rate = s.games ? Math.round(s.wins / s.games * 100) : 0;
      var best = Object.keys(s.perGame).sort(function(a, b) { return s.perGame[b].w - s.perGame[a].w; })[0];
      html += '<div class="rank-row' + (i === 0 ? ' top' : '') + '">' +
        '<span class="rank-medal">' + (medals[i] || (i + 1) + '.') + '</span>' +
        '<span class="rank-main"><b>' + escapeHtml(s.name) + '</b><small>' +
          s.wins + ' Siege aus ' + s.games + ' Partien' + (best && s.perGame[best].w ? ' · stark in ' + GAMES[best].icon + ' ' + GAMES[best].name : '') +
          (s.coopGames ? ' · 🤝 ' + s.coopWins + '/' + s.coopGames + ' kooperativ' : '') + '</small>' +
          '<span class="rank-bar"><i style="width:' + rate + '%"></i></span></span>' +
        '<span class="rank-rate">' + rate + '%</span></div>';
    });
    return html + '</div>';
  }

  // ===================================================================
  // ---------- Lost Cities (2 Spieler, Expeditionen) ----------
  // ===================================================================
  var LC_COLORS = [
    { id:'y', name:'Wüste',    icon:'🏜️', c1:'#f7d25a', c2:'#d99a1c' },
    { id:'b', name:'Meer',     icon:'🌊', c1:'#6fb0f0', c2:'#2a64b8' },
    { id:'w', name:'Himalaya', icon:'🏔️', c1:'#f4f4f6', c2:'#aeb4c4' },
    { id:'g', name:'Dschungel',icon:'🌿', c1:'#7fd07a', c2:'#2f8a3a' },
    { id:'r', name:'Vulkan',   icon:'🌋', c1:'#f58a6a', c2:'#c0322a' }
  ];
  var LC_COLOR = {}; LC_COLORS.forEach(function(c) { LC_COLOR[c.id] = c; });
  var lcSetupNames = ['', ''];
  var lcSetupRounds = 3;
  var lcState = { phase: 'setup', players: [], deck: [], discards: {}, current: 0, round: 1, rounds: 3, step: 'play', selected: null, lastDiscard: null, roundScores: null, showHistory: false };

  function lcBuildDeck() {
    var d = [], id = 0;
    LC_COLORS.forEach(function(c) {
      for (var w = 0; w < 3; w++) d.push({ color: c.id, value: 0, id: id++ });
      for (var v = 2; v <= 10; v++) d.push({ color: c.id, value: v, id: id++ });
    });
    return shuffleDeck(d);
  }
  function lcExpScore(cards) {
    if (!cards.length) return 0;
    var wagers = 0, sum = 0;
    cards.forEach(function(c) { if (c.value === 0) wagers++; else sum += c.value; });
    return (sum - 20) * (1 + wagers) + (cards.length >= 8 ? 20 : 0);
  }
  function lcPlayerScore(p) { return LC_COLORS.reduce(function(a, c) { return a + lcExpScore(p.exp[c.id]); }, 0); }
  function lcCanPlay(p, card) {
    var exp = p.exp[card.color];
    if (!exp.length) return true;
    var top = exp[exp.length - 1];
    if (card.value === 0) return top.value === 0;
    return card.value > top.value;
  }
  function lcSortHand(hand) {
    var order = { y:0, b:1, w:2, g:3, r:4 };
    hand.sort(function(a, b) { return order[a.color] - order[b.color] || a.value - b.value; });
  }
  function lcCardHtml(card, opts) {
    opts = opts || {};
    var c = LC_COLOR[card.color];
    return '<div class="lc-card c-' + card.color + (opts.cls ? ' ' + opts.cls : '') + (opts.selected ? ' selected' : '') + (opts.clickable ? ' clickable' : '') + '" style="--c1:' + c.c1 + ';--c2:' + c.c2 + '"' + (opts.attrs || '') + '>' +
      '<span class="lc-v">' + (card.value === 0 ? '🤝' : card.value) + '</span>' +
      '<span class="lc-ic">' + c.icon + '</span>' +
      (opts.cls === 'mini' ? '' : '<span class="lc-v2">' + (card.value === 0 ? '×2' : card.value) + '</span>') +
    '</div>';
  }

  function renderLcScreen() {
    var st = lcState;
    if (st.phase === 'setup') renderLcSetup();
    else if (st.phase === 'pass') renderLcPass();
    else if (st.phase === 'turn') renderLcTurn();
    else if (st.phase === 'roundEnd' || st.phase === 'finished') renderLcRoundEnd();
    if (st.showHistory) sgRenderHistoryOverlay('lostcities');
  }
  function renderLcSetup() {
    subtitle.textContent = 'Expeditionen starten, Karten aufsteigend legen · 2 Spieler';
    var html = '<div class="card">' + sgNamesHtml(lcSetupNames, 'lc', 2, 2);
    html += '<h2 class="section-title">🧭 Runden</h2><div class="btn-row" style="margin-top:0">';
    [1, 3].forEach(function(n) { html += '<button class="btn ' + (lcSetupRounds === n ? 'btn-primary' : 'btn-ghost') + '" data-lcrounds="' + n + '" style="flex:1">' + n + (n === 1 ? ' Runde' : ' Runden') + '</button>'; });
    html += '</div>';
    html += '<div class="sg-rules"><div class="lc-rules-cards">' + LC_COLORS.map(function(c, i) { return lcCardHtml({ color: c.id, value: i === 0 ? 0 : i * 2 + 2 }); }).join('') + '</div><ul>' +
      '<li>5 Expeditionen, Karten <b>2–10</b> und je 3 <b>Wettkarten 🤝</b>. Jede*r hat 8 Karten auf der Hand.</li>' +
      '<li>Pro Zug: <b>eine Karte ausspielen</b> (auf deine Expedition, streng aufsteigend – Wettkarten nur zu Beginn) <b>oder abwerfen</b>, dann <b>eine Karte ziehen</b> (Stapel oder eine Ablage).</li>' +
      '<li>Wertung pro gestarteter Expedition: (Summe − 20) × (1 + Wettkarten), ab 8 Karten +20 Bonus.</li>' +
      '<li>Die Runde endet, sobald der Nachziehstapel leer ist.</li></ul></div>';
    html += '<div class="btn-row"><button class="btn btn-primary" id="lcStart" style="flex:1">🚀 Los geht\'s!</button></div></div>';
    main.innerHTML = html;
    sgBindNames(lcSetupNames, 'lc', 2);
    document.querySelectorAll('[data-lcrounds]').forEach(function(b) { b.addEventListener('click', function() { lcSetupRounds = Number(this.dataset.lcrounds); render(); }); });
    document.getElementById('lcStart').addEventListener('click', function() {
      var names = sgFinalNames(lcSetupNames);
      lcState.players = names.map(function(n) { return { name: n, total: 0, hand: [], exp: {} }; });
      lcState.rounds = lcSetupRounds;
      lcState.round = 1;
      lcDeal();
      render();
    });
  }
  function lcDeal() {
    var st = lcState;
    st.deck = lcBuildDeck();
    st.discards = {};
    LC_COLORS.forEach(function(c) { st.discards[c.id] = []; });
    st.players.forEach(function(p) {
      p.hand = st.deck.splice(0, 8);

  // ===================================================================
  // ---------- Backgammon (2 Spieler, ein Gerät) ----------
  // ===================================================================
  // Punkte-Index 0..23 = Punkt 1..24 aus Sicht von Weiß. Weiß zieht 23→0 (Heimfeld 0–5), Schwarz 0→23 (Heimfeld 18–23).
  var bgSetupNames = ['', ''];
  var bgSetupMatch = 3;
  var bgState = { phase: 'setup', names: [], score: { w: 0, b: 0 }, matchTo: 3, pos: null, turn: 'w', dice: [], rolled: false, selected: null, snapshot: null, lastResult: null, opening: null, showHistory: false };

  function bgInitialPos() {
    var pts = [];
    for (var i = 0; i < 24; i++) pts.push({ c: null, n: 0 });
    function put(i, c, n) { pts[i] = { c: c, n: n }; }
    put(23, 'w', 2); put(12, 'w', 5); put(7, 'w', 3); put(5, 'w', 5);
    put(0, 'b', 2); put(11, 'b', 5); put(16, 'b', 3); put(18, 'b', 5);
    return { pts: pts, bar: { w: 0, b: 0 }, off: { w: 0, b: 0 } };
  }
  function bgClone(pos) {
    return { pts: pos.pts.map(function(p) { return { c: p.c, n: p.n }; }), bar: { w: pos.bar.w, b: pos.bar.b }, off: { w: pos.off.w, b: pos.off.b } };
  }
  function bgOpp(c) { return c === 'w' ? 'b' : 'w'; }
  function bgAllHome(pos, c) {
    if (pos.bar[c]) return false;
    for (var i = 0; i < 24; i++) {
      if (pos.pts[i].c === c && pos.pts[i].n > 0) {
        if (c === 'w' && i > 5) return false;
        if (c === 'b' && i < 18) return false;
      }
    }
    return true;
  }
  // Alle Einzelzüge für einen Würfelwert
  function bgSingleMoves(pos, c, d) {
    var moves = [], o = bgOpp(c);
    function open(i) { var p = pos.pts[i]; return !(p.c === o && p.n >= 2); }

  // ---------- Qwixx (2–5 Spieler, Würfel & Ankreuzen) ----------

  var QX_ROWS = [
    { id:'r', name:'Rot',  asc:true,  c:'#d8343a', soft:'#fbe0e0' },
    { id:'y', name:'Gelb', asc:true,  c:'#e8b400', soft:'#fff4c8' },
    { id:'g', name:'Grün', asc:false, c:'#2e9a46', soft:'#dcf3e0' },
    { id:'b', name:'Blau', asc:false, c:'#2a64c0', soft:'#dde8fa' }
  ];
  var QX_SCORE = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66, 78];
  var qxSetupNames = ['', ''];
  var qxState = { phase: 'setup', players: [], active: 0, dice: null, step: 'roll', locked: {}, pendingLock: {}, whiteUsed: {}, colorUsed: false, activeCrossed: false, log: [], showHistory: false };

  function qxNum(row, k) { return row.asc ? k + 2 : 12 - k; }
  function qxIndexOf(row, n) { return row.asc ? n - 2 : 12 - n; }
  function qxLastIdx(p, rid) { var a = p.marks[rid]; for (var k = 10; k >= 0; k--) if (a[k]) return k; return -1; }
  function qxCount(p, rid) { return p.marks[rid].filter(Boolean).length + (p.locks[rid] ? 1 : 0); }
  function qxCanCross(p, row, k) {
    var st = qxState;
    if (st.locked[row.id] && !st.pendingLock[row.id]) return false;
    if (p.marks[row.id][k]) return false;
    if (k <= qxLastIdx(p, row.id)) return false;
    if (k === 10 && p.marks[row.id].filter(Boolean).length < 5) return false;
    return true;
  }
  function qxScore(p) {
    var s = 0;
    QX_ROWS.forEach(function(r) { s += QX_SCORE[Math.min(12, qxCount(p, r.id))]; });
    return s - 5 * p.penalties;
  }
  function qxCross(p, row, k) {
    p.marks[row.id][k] = true;
    if (k === 10) { p.locks[row.id] = true; qxState.pendingLock[row.id] = true; }
  }

  function qxDiceHtml() {

  function qxSheetHtml(p, pIdx, cellOk) {

        var ok = cellOk && cellOk(r, k);

        html += '<button class="qx-cell' + (x ? ' x' : '') + (ok ? ' ok' : '') + (!x && k <= qxLastIdx(p, r.id) ? ' skip' : '') + '"' + (ok ? ' data-qx="' + pIdx + ',' + r.id + ',' + k + '"' : ' disabled') + '>' + qxNum(r, k) + '</button>';

  function renderQxPlaying() {

  function qxGoColor() {

  function qxEndTurn() {

    var winners = sorted.filter(function(p) { return qxScore(p) === best; });
    sgWinnerOverlay('qwixx', '🎉 ' + winners.map(function(p) { return escapeHtml(p.name); }).join(' & ') + ' gewinnt!', st.endReason,
      sorted.map(function(p) { return [escapeHtml(p.name), qxScore(p) + ' Pkt']; }));
  }
  SG.qwixx = { key: 'qwixx_matches_v1', icon: '✖️', lower: false, state: function() { return qxState; }, render: renderQxScreen };

  // ===================================================================
  // ---------- Top-level dispatcher ----------
  // ===================================================================
  var lastRenderedScreen = null;
  function render() {
    var mainEl = document.getElementById('main');
    mainEl.classList.toggle('screen-in', lastRenderedScreen !== appState.screen);
    if (lastRenderedScreen !== appState.screen) window.scrollTo(0, 0);
    lastRenderedScreen = appState.screen;
    document.getElementById('homeToggle').style.display = appState.screen === 'home' ? 'none' : 'inline-flex';
    document.getElementById('app').classList.toggle('carc-fixed', appState.screen === 'carcassonne' && carcState.phase === 'playing');
    document.getElementById('app').classList.toggle('fit-screen', (appState.screen === 'kniffel' && state.phase !== 'setup') || (appState.screen === 'qwixx' && qxState.phase === 'playing'));

    if (appState.screen === 'home') {
      document.getElementById('brandIcon').textContent = '🎉';
      document.getElementById('brandTitle').textContent = 'Spieleabend';
      renderHome();
      return;
    }

    var g = GAMES[appState.screen];
    document.getElementById('brandIcon').textContent = g.icon;
    document.getElementById('brandTitle').textContent = g.name;

    if (appState.screen === 'kniffel') renderKniffelScreen();
    else if (appState.screen === 'knack') renderKnackScreen();
    else if (appState.screen === 'schach') renderSchachScreen();
    else if (appState.screen === 'cabo') renderCaboScreen();
    else if (appState.screen === 'carcassonne') renderCarcScreen();
    else if (SG[appState.screen]) SG[appState.screen].render();
  }

  render();
  } // Ende startApp()

  // ---------- Boot: erst Cloud-Daten laden, dann App starten ----------
  var bootOverlay = document.createElement('div');
  bootOverlay.id = 'cloudBootOverlay';
  bootOverlay.style.cssText = 'position:fixed;inset:0;background:#181614;color:#eee;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;z-index:99999;';
  bootOverlay.textContent = '🎉 Lade Spielstände …';
  document.body.appendChild(bootOverlay);

  fetch(SYNC_ENDPOINT)
    .then(function(r) { return r.ok ? r.json() : {}; })
    .catch(function() { return {}; })
    .then(function(data) {
      try {
        Object.keys(data || {}).forEach(function(k) { _setItem(k, data[k]); });
      } catch (e) {}
      if (bootOverlay.parentNode) bootOverlay.parentNode.removeChild(bootOverlay);
      startApp();
    });
})();
</script>
</body>
</html>
